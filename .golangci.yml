version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # integer conversions are bounded by the data model
        - G404 # math/rand is used for jitter and test data only
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]
      - path: internal/(fakett|testenv)/
        linters: [gosec]
      # The probe and Phase 0 tool read and write files the operator names.
      - path: (cmd/tks-spike)/
        linters: [gosec]
        text: "G(301|302|304|306|703)"
