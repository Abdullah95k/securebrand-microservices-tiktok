# Logged-out Instagram GraphQL query registry seed (igs).
#
# The five operations the logged-out web app used in the owner's recordings
# (docs/instagram/har-findings-2026-10-30.md §1). doc_ids were valid on
# 2026-10-30 and rotate; registry sync (M9) follows them, or set a row by
# hand. Variables are a JSON template: a string value "{{name}}" is replaced
# by the caller's value (JSON null when not given).
#
# Four operations go to /api/graphql (the builder's default); highlights
# goes to /graphql/query with the root field named in a header. The
# highlights variables beyond reel_ids, initial_reel_id and first are a
# hypothesis: the recording also showed apply_new_highlights_filter and a
# community-notes provider flag whose exact name and value it does not
# give. The probe reports whether this shape works.
client_params:
  __a: "1"
  __d: "www"
  __comet_req: "7"
  dpr: "1"
  __ccg: "EXCELLENT"
  fb_api_caller_class: "RelayModern"
  server_timestamps: "true"
  x_asbd_id: "359341"
  app_id: "936619743392459"

queries:
  - name: profile
    friendly_name: PolarisLoggedOutDesktopWWWProfileRootContentQuery
    doc_id: "27981003384861049"
    parser: profile
    parser_version: 1
    priority: 10
    variables:
      username: "{{username}}"

  # The grid's first page, by username.
  - name: grid_first
    friendly_name: PolarisLoggedOutDesktopWWWProfilePostsTabContentQuery
    doc_id: "29483846714553007"
    parser: grid
    parser_version: 1
    priority: 10
    variables:
      username: "{{username}}"
      first: 12
      __relay_internal__pv__PolarisSEOIsCrawlerrelayprovider: false

  # Later grid pages, by the user's id and a cursor. The id is the user
  # object's "id" (17841...), not its "pk": with the pk, Instagram answers
  # {"data":{"node":null}} (the owner's probe run, 2026-10-31). U9: whether
  # it also answers with no cursor (a profile read by id alone).
  - name: grid
    friendly_name: PolarisLoggedOutDesktopWWWProfilePostsTabContentQuery_connection
    doc_id: "28904005159232689"
    parser: grid
    parser_version: 1
    priority: 10
    variables:
      id: "{{user_id}}"
      after: "{{cursor}}"
      first: 12
      __relay_internal__pv__PolarisSEOIsCrawlerrelayprovider: false

  # Top-level comments, 10 per page, newest first. With "after": "" the
  # comments connection fails (field_exception); a first page needs null
  # (an absent cursor renders as null) or the post page's embedded comments.
  - name: comments
    friendly_name: PolarisLoggedOutDesktopWWWPostCommentsPaginationQuery
    doc_id: "27837656105907150"
    parser: comments
    parser_version: 1
    priority: 10
    variables:
      media_id: "{{media_pk}}"
      after: "{{cursor}}"
      first: 10

  - name: highlights
    friendly_name: PolarisStoriesV3HighlightsLoggedOutPageQuery
    doc_id: "39683663864580775"
    parser: highlights
    parser_version: 1
    priority: 10
    endpoint: /graphql/query
    headers:
      - {name: x-root-field-name, value: xdt_api__v1__feed__reels_media__connection}
    variables:
      reel_ids: "{{reel_ids}}"
      initial_reel_id: "{{initial_reel_id}}"
      first: 1
      apply_new_highlights_filter: true
