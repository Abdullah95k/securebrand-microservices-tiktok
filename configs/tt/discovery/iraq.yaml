# Copied from fbs (Abdullah95k/securebrand-microservices) configs/discovery/iraq.yaml
# at 9bea690 (2026-11-03) for tks keyword discovery (docs/tiktok/discovery-plan.md).
# Not embedded or loaded yet: M10 adds `tksctl discovery keywords seed`.
#
# Discovery keyword seed: Iraq, the Kurdistan Region, the 19 governorates
# and their key cities and towns. `fbctl discovery keywords seed` loads it;
# loading it again adds only what is new, and never re-enables a keyword
# someone turned off.
#
# Each group is a governorate (or the country). `terms` are searched;
# `off` are loaded disabled: real spellings that are also common words or
# names (حديثة "modern", القائم "the existing", Hit, Soran, Rania...), which
# would bring in mostly unrelated posts. Enable them one by one through the
# API if they prove useful.
#
# Languages: en English (with common transliterations), ar Arabic (with and
# without the article where the bare form is distinctive), ckb Sorani
# Kurdish (Arabic script), kmr Kurmanji Kurdish (Latin script). Spellings
# Kurdish media use; where one wasn't certain it was left out, not guessed.
groups:
  - name: iraq
    terms:
      en: [Iraq, Iraqi]
      ar: [العراق, عراق, العراقية, العراقي]
      ckb: [عێراق]
      kmr: [Iraq, Iraqê]

  - name: kurdistan_region
    terms:
      en: [Kurdistan Region, KRG, Kurdistan Region of Iraq]
      ar: [إقليم كوردستان, إقليم كردستان, اقليم كوردستان, اقليم كردستان]
      ckb: [هەرێمی کوردستان]
      kmr: [Herêma Kurdistanê]

  - name: baghdad
    terms:
      en: [Baghdad, Kadhimiya, Kazimiyah, Adhamiya, Abu Ghraib, Sadr City]
      ar: [بغداد, الكاظمية, الأعظمية, ابو غريب, أبو غريب, مدينة الصدر]
      ckb: [بەغدا]
      kmr: [Bexda]

  - name: basra
    terms:
      en: [Basra, Basrah, Umm Qasr, Al-Faw, Qurna, Al-Qurnah]
      ar: [البصرة, بصرة, أم قصر, ام قصر, الفاو, القرنة]
      ckb: [بەسرە]
      kmr: [Besra]
    off:
      en: [Zubayr, Zubair, Faw, Fao]
      ar: [الزبير]

  - name: nineveh
    terms:
      en: [Nineveh, Ninawa, Ninewa, Mosul, Sinjar, Shingal, Tal Afar, Tel Afar, Talafar, Qaraqosh, Bakhdida, Bashiqa]
      ar: [نينوى, الموصل, موصل, سنجار, تلعفر, تل عفر, قره قوش, بغديدا, بعشيقة]
      ckb: [نەینەوا, مووسڵ, شنگال]
      kmr: [Neynewa, Mûsil, Şengal]

  - name: erbil
    terms:
      en: [Erbil, Arbil, Irbil, Hawler, Hewler, Shaqlawa, Rawanduz, Rwanduz, Makhmour, Makhmur, Ankawa, Choman]
      ar: [أربيل, اربيل, شقلاوة, راوندوز, مخمور, عنكاوا]
      ckb: [هەولێر, کۆیە, شەقڵاوە, ڕەواندز, مەخموور, عەنکاوە, چۆمان]
      kmr: [Hewlêr, Koye, Şeqlawe, Rewandiz, Mexmûr]
    off:
      en: [Soran, Koya, Koysinjaq]
      ar: [سوران, كويه, كوية]
      ckb: [سۆران]
      kmr: [Soran]

  - name: sulaymaniyah
    terms:
