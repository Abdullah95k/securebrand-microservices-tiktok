# TikTok's logged-out web API, as the owner's recordings show it
# (docs/tiktok/har-findings-2026-10-31.md §2) and public sources describe it
# (docs/tiktok/methods.md §2.2). TikTok has no doc_ids: doc_id holds the
# variant label, variables the call's own query parameters (null values are
# left out), method says GET (docs/tiktok ADR 0006 §3). The builder adds the
# web client's standard parameters (client_params below), the identity's
# page values (device_id, odinId, WebIdLastTime, region, language) and sorts
# them as the browser does.
client_params:
  aid: "1988"
  app_language: en
  app_name: tiktok_web
  browser_name: Mozilla
  browser_online: "true"
  channel: tiktok_web
  cookie_enabled: "true"
  data_collection_enabled: "false"
  device_platform: web_pc
  focus_state: "true"
  history_len: "3"
  is_fullscreen: "false"
  is_page_visible: "true"
  priority_region: ""
  screen_height: "1080"
  screen_width: "1920"
  tz_name: Asia/Baghdad
  user_is_login: "false"
  webcast_language: en
queries:
  # The post list the web app itself calls; the recordings show it signed
  # with X-Gnarly (T4).
  - name: post_list
    doc_id: web
    method: GET
    endpoint: /api/post/item_list/
    parser: post_list
    priority: 10
    variables:
      secUid: "{{sec_uid}}"
      count: "{{count}}"
      cursor: "{{cursor}}"
      coverFormat: "2"
      from_page: user
      needPinnedItemIds: "true"
      post_item_list_request_type: "0"
      video_encoding: dash
  # The post list yt-dlp and gallery-dl call without a signature (T4).
  - name: creator_list
    doc_id: creator
    method: GET
    endpoint: /api/creator/item_list/
    parser: post_list
    priority: 10
    variables:
      secUid: "{{sec_uid}}"
      count: "{{count}}"
      cursor: "{{cursor}}"
      type: "1"
      verifyFp: verify_tks
  - name: user_detail
    doc_id: web
    method: GET
    endpoint: /api/user/detail/
    parser: user_detail
    priority: 10
    variables:
      uniqueId: "{{username}}"
      secUid: "{{sec_uid}}"
  - name: item_detail
    doc_id: web
    method: GET
    endpoint: /api/item/detail/
    parser: item_detail
    priority: 10
    variables:
      itemId: "{{item_id}}"
  # Following (scene 21) and followers (scene 67): served logged out and
  # unsigned from US exits (C6 run 1, 2026-11-05: followers 17 of 17
  # calls); a following list the profile hides answers 10222. minCursor
  # pages back (T36); discovery part D (ADR 0007 §23).
  - name: user_list
    doc_id: web
    method: GET
    endpoint: /api/user/list/
    parser: users
    priority: 10
    variables:
      secUid: "{{sec_uid}}"
      scene: "{{scene}}"
      count: "{{count}}"
      minCursor: "{{cursor}}"
      maxCursor: "0"
  # Comments and replies need TikTok's signature (C2, C3): the label's
  # "-signed" sends them through the browser signer (tt.signer.mode).
  - name: comments
    doc_id: web-signed
    method: GET
    endpoint: /api/comment/list/
    parser: comments
    priority: 10
    variables:
      aweme_id: "{{item_id}}"
      count: "{{count}}"
      cursor: "{{cursor}}"
      from_page: video
  - name: replies
    doc_id: web-signed
    method: GET
    endpoint: /api/comment/list/reply/
    parser: comments
    priority: 10
    variables:
      item_id: "{{item_id}}"
      comment_id: "{{comment_id}}"
      count: "{{count}}"
      cursor: "{{cursor}}"
      from_page: video
  # Discovery part C (docs/tiktok/discovery-plan.md §8, ADR 0007 §27):
  # every one served logged out only signed (C6 run 2, 2026-11-06: unsigned
  # no answer; signed on a profile page, as the crawler's signer signs, all
  # answered), so their label is "web-signed". Search from US exits answers
  # 2483 (T37): it runs only through tt.discovery.search.tier. The
  # parameters are the probe's (internal/tt/discprobe/operations.yaml); the
  # tag page's calls carry challengeID, count, cursor and coverFormat (C6
  # run 2 §3).
  - name: search_general
    doc_id: web-signed
    method: GET
    endpoint: /api/search/general/full/
    parser: found
    priority: 10
    variables:
      keyword: "{{keyword}}"
      offset: "{{offset}}"
      cursor: "{{offset}}"
      count: "12"
      search_source: normal_search
      search_id: "{{search_id}}"
      is_non_personalized_search: "0"
      from_page: search
  - name: challenge_detail
    doc_id: web-signed
    method: GET
    endpoint: /api/challenge/detail/
    parser: challenge_detail
    priority: 10
    variables:
      challengeName: "{{name}}"
  - name: challenge_list
    doc_id: web-signed
    method: GET
    endpoint: /api/challenge/item_list/
    parser: found
    priority: 10
    variables:
      challengeID: "{{id}}"
      count: "30"
      cursor: "{{offset}}"
      coverFormat: "2"
  - name: music_list
    doc_id: web-signed
    method: GET
    endpoint: /api/music/item_list/
    parser: found
    priority: 10
    variables:
      musicID: "{{id}}"
      count: "30"
      cursor: "{{offset}}"
      coverFormat: "2"
  - name: related_list
    doc_id: web-signed
    method: GET
    endpoint: /api/related/item_list/
    parser: found
    priority: 10
    variables:
      itemID: "{{item_id}}"
      count: "16"
  - name: recommend_list
    doc_id: web-signed
    method: GET
    endpoint: /api/recommend/item_list/
    parser: found
    priority: 10
    variables:
      count: "12"
      from_page: fyp
      pullType: "{{pull}}"
