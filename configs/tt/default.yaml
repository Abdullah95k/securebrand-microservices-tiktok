# tks's TikTok client and freshness defaults (docs/tiktok ADR 0006 §6, ADR
# 0007 §4), loaded after configs/default.yaml and before any config file or
# TKS_ variable (TKS_TT__SIGNER__MODE=none, for example). Values marked
# "after Phase 0" are provisional: C4's measurements confirm or change them
# with the owner (build brief §6, D9).
tt:
  # The logged-out web client. Tests and local dev point this at fakett.
  base_url: "https://www.tiktok.com"
  # The operation registry's seed (configs/tt/...), applied to tt.operations
  # by `tksctl migrate up`.
  operation_seed: "tt/operations.seed.yaml"
  registry_refresh: 30s
  # The probe's Chrome 152 fingerprint, as the recordings' browser sent it.
  fingerprint_profile: chrome_152
  fingerprint_profiles: []
  accept_language: "en-US,en;q=0.9"
  request_timeout: 30s
  # A person's pace per identity (the probe's: one request every ~3 s, no
  # captcha in 11,509 requests through 10 IPs; C3).
  identity_rps: 0.33
  identity_burst: 2
  # Requests an identity serves before it is replaced (each replacement is
  # one page load).
  identity_max_requests_min: 400
  identity_max_requests_max: 800
  # Per account, fleet wide (Redis GCRA), and the fleet's ceiling (AIMD's
  # starting point). After Phase 0.
  account_rps: 1
  account_rps_p0: 2
  global_rps: 50
  # Page sizes: the creator list answers at most 15 posts a page whatever
  # count asks (C2); comments 20 and replies 3 a page, as the web app asks.
  list_page_size: 15
  comments_page_size: 20
  replies_page_size: 3
  capture_raw: failures    # all | failures | none
  proxy:
    tiers: []
    routing:
      default: [direct]
    breaker:
      window: 1m
      min_events: 20
      open_rate: 0.15
      cooldown: 2m
      max_cooldown: 30m
      probe_successes: 3
    # TikTok did not wall page loads in C2 or C3, so they are not paced
    # apart from API calls. Zeros turn the pacing off.
    page_loads:
      interval: 0s
      backoff: 0s
      max_backoff: 0s
  query_breaker:
    window: 5m
    min_events: 20
    open_rate: 0.5
    cooldown: 2m
    max_cooldown: 30m
    probe_successes: 3
  aimd:
    enabled: true
    interval: 10s
    min_rps: 5
    max_rps: 500
    increase: 0.02
    decrease: 0.7
    low_block_rate: 0.02
    high_block_rate: 0.06
    min_samples: 100
    min_utilization: 0.8
  # Headless Chromium for bootstraps whose page carries no values (a shell
  # page, T1). The signer below has its own pages.
  browser:
    enabled: false
    binary: ""
    max_concurrent: 2
    max_share: 0.02
    timeout: 45s
    no_sandbox: false
  # Replaces parts of TikTok's detect rules (internal/tt/detect).
  detect: {}
  # The browser signer (build brief D11, G1): a few TikTok pages in Chrome
  # without its automation flag sign each comment and reply request, which
  # plain-HTTP workers send from any identity (a signature covers its
  # query, so one per request; T27). A page signs a call without sending it
  # (T32). mode browser signs the operation variants whose registry label
  # ends in "-signed" (comments and replies) and sends the rest as built;
  # mode none signs nothing, so comments and replies are refused. mode
  # remote has tks-signer sign (M9d): the pages run in their own capped
  # service, which reads this same section for them, and a runaway page
  # takes down only that service (the chart's default). mode browser keeps
  # the pages in the process itself (the probes, Phase 0, local runs).
  signer:
    mode: browser          # none | browser | remote
    remote_url: ""         # tks-signer, e.g. http://tks-signer:8080 (mode remote)
    pages: 2               # per process that keeps pages (tks-signer's in mode remote)
    page_max_signs: 500    # a page is reopened after this many signatures
    page_max_age: 30m
    sign_timeout: 30s
    page_timeout: 60s
    # Alert when signed calls exceed this share of all calls (comments and
    # replies only, so a rise means an operation lost its unsigned variant).
    max_share: 0.5
    # Safety nets: a page unused this long is closed, and a page whose
    # Chrome uses more memory is reopened (the pilot server froze when an
    # idle signer page grew to 7 GB, 2026-11-03; 0 turns either off).
    idle_close: 2m
    max_page_mb: 800
    # The hard guard: a page past this is closed even while it signs,
    # within 10 s (its call fails and is signed again on a fresh page), so
    # two pages never reach a 2 GiB limit together (0 turns it off).
    kill_page_mb: 1200
    # A page whose signed calls TikTok refuses this many times in a row is
    # replaced (C4: pages went bad within minutes and every call they signed
    # was refused until a fresh page took over; 0 turns it off).
    max_refusals: 2
    # The runaway's cures, measured on TikTok (S2, 2026-11-03: every signed
    # call answered with each): a page frozen between its signatures (CPU
    # 9 % instead of 93 %, no growth while idle), and pages opened on the
    # account's profile page instead of the post's video page (the runaway
    # is the video page's); without autoplay and images, which alone does
    # not stop it but saves a third of the page's proxy data.
    freeze: true
    lite: true
    open_on: profile   # call | profile
  # tks-canary (build brief M8; runbook docs/runbooks/tks-canary.md): every
  # interval it reads a profile page, a list page, a comment page and a reply
  # page of the canary accounts with each variant of the crawler's
  # operations, and promotes a working variant when the active one stops
  # answering (or an unsigned one answers where the active one is signed).
  canary:
    interval: 1h
    # Public usernames with posts, comments and replies, set in the
    # deployment (TKS_TT__CANARY__ACCOUNTS), never committed.
    accounts: []
    operations: [creator_list, comments, replies]
    tier: ""
    twins: true        # try each variant's signed or unsigned twin
    confirm: 2         # accounts that must refuse a variant in a run
    promote: true
    keep_fallbacks: 2
    retire_after: 3
    recheck_retired: 24h
    timeout: 10m
  # How fresh the data is kept (build brief D2, ADR 0007 §4).
  freshness:
    # Each account's post list: 99 % of new posts stored within 3 h needs a
    # check every 2 h 45 min (owner, 2026-10-31).
    list_interval: 2h45m
    # The account itself: daily, from the list's author objects.
    account_refresh: 24h
    # The profile page, the only source of the bio link.
    page_refresh: 168h
    # New accounts: every post back this far, or to the first post.
    backfill_days: 365
    # Deeper metric refreshes than the list check gives: walk the list
    # every `every` back `back`. After Phase 0.
    metrics_walks:
      - {every: 24h, back: 720h}
      - {every: 168h, back: 8760h}
    # Comments are re-read only when a post's comment count went up, at
    # most every `interval` while the post is younger than `max_age`;
    # older posts only when the weekly metrics walk sees the count grow.
    # After Phase 0.
    comment_windows:
      - {max_age: 48h, interval: 6h}
      - {max_age: 168h, interval: 24h}
      - {max_age: 720h, interval: 168h}
    # The owner's accounts that went quiet (discovery-plan §5.4): a private
    # one daily for 7 days, then weekly; a banned or missing one weekly for
    # 30 days, then monthly. A check that finds one active puts it back on
    # list_interval. Discovered accounts move to the dormant list instead.
    inactive:
      private: {first: 24h, for: 168h, then: 168h}
      gone: {first: 168h, for: 720h, then: 720h}
  comments:
    # TikTok serves top-level comments in its ranking order (T13), so a
    # refresh re-reads them to the cap: ranked. newest reads until the
    # first stored comment (for a future sort parameter).
    order: ranked          # ranked | newest
    # Top-level comments plus replies read per post and pass; 0 reads every
    # comment and reply (owner, 2026-11-01: all data is collected).
    max_per_post: 0
    include_replies: true
    # A whole read marks the stored comments it did not return as deleted
    # only when what it returned (comments plus the replies TikTok counts
    # for them) is within this share of the post's comment count: TikTok's
    # count includes comments it does not serve (T15; one post read to the
    # end had 96 % in the recordings). After Phase 0.
    deletion_slack: 0.1
  # Posts no longer public (docs/tiktok/discovery-plan.md §17): a stored
  # visible post that a full list page covering its date did not return is
  # a candidate; one read of its page by plain HTTP confirms it, and it is
  # marked "unavailable" (never "deleted") with the page's statusCode and
  # the exit's region. Nothing is deleted (D8); a post that comes back is
  # visible again, with the change kept.
  posts:
    unavailable:
      enabled: true
      # A page with fewer posts marks nothing: the creator list serves 15,
      # one account 14 throughout (C2), and a short page may be TikTok's
      # time window (C3 §4).
      min_page_posts: 14
      # More candidates than this on one page is a reading problem.
      max_per_page: 3
      # Post pages one account check reads to confirm candidates (93 KB
      # and 1.3 s each: C3 §5).
      max_checks: 5
      # The post page's statusCode for a post that is not public: 10216, a
      # post made private (yt-dlp's; T6). Other codes mark nothing and are
      # counted (unknown_code; 10204 "item not exist" is unconfirmed: T34).
      codes: [10216]
      # Codes about the account (unknown, banned, private): its posts keep
      # their status.
      account_codes: [10202, 10221, 10222]
  # Media downloads (build brief D5): off until the analysis service exists.
  # Metadata (covers, photos, video renditions, avatars) is always published;
  # TKS_TT__MEDIA__INCLUDE=true queues the downloads too.
  media:
    include: false
    # A video file needs the reading identity's tt_chain_token cookie (T18);
    # the downloader sends it to these hosts and their subdomains only.
    # tks-media-downloader stores the files and keeps them: it sets no TTL
    # and deletes nothing (another service deletes them: owner, 2026-11-02).
    cookie_domains: [tiktok.com]
  # Retention of what tks stores, in days; 0 keeps it for good. The owner
  # chose (2026-11-01) that tks deletes nothing, so every value is 0; a
  # positive one turns that step back on (ADR 0007 §14). privacy.retention
  # was the removed Facebook pipeline's and tks does not read it.
  retention:
    comments_days: 0          # comment partitions
    metrics_days: 0           # post_metrics and account_snapshots partitions
    authors_inactive_days: 0  # people not seen since
    jobs_days: 0              # finished jobs and canary runs
    media_rows_days: 0        # media rows never handed over
    raw_payload_days: 0       # raw answers sampled to the raw bucket
  # Paced admission of new accounts (discovery-plan §5.3): their first read
  # (365 days of posts and comments) waits in a queue, the owner's own first,
  # then discovered ones by Iraq score; checks never wait.
  admission:
    # New accounts admitted an hour; 0 derives it from the request budget
    # (scheduler.budget.requests_per_day), or admits all at once without one.
    per_hour: 0
    # A new account's first read in requests (C3: ~380 posts a year at the
    # median, their comments signed page by page). After C4's prices.
    requests_per_account: 1500
    # Phase 0 (C4): 678,256 calls a day per 1,000 accounts through 2 IPs
    # and 2 signer pages, 95 % signed.
    ip_requests_per_day: 339000
    page_signs_per_day: 322000
    signed_share: 0.95
  # A day's cost (build brief §8 A5): the leader prices the last 24 hours
  # every interval (tks_cost_per_account_usd): IPs a month, the signer
  # pages' browser time, compute per account and storage, over the accounts
  # with a schedule. The owner's prices of 2026-11-05: an ISP IP $3 a month
  # with unlimited data; the rest are the owner's assumptions until real
  # prices replace them ($48 a month for 4 signer pages on an 8 GB / 4 vCPU
  # server, $0.0002 compute per account a day, $0.10 per GB-month). 0
  # leaves a part unpriced.
  cost:
    interval: 5m
    ip_month_usd: 3
    ips: 0                       # 0: the endpoints of tt.proxy.tiers' static lists
    browser_hour_usd: 0.017
    compute_usd_per_account_day: 0.0002
    storage_gb_month_usd: 0.10
    # The owner's budget (D9, 2026-11-05): C4's estimate plus 50 %
    # (about $0.00126 + 50 %). Over it only backfills pause (and with them
    # the admission of new accounts); checks never wait or stretch. The
    # alert fires at alert_share of it. 0 turns the pause off.
    budget_per_account_usd: 0.0019
    alert_share: 0.9
  # Account discovery (discovery-plan.md): off until each source is built
  # and C6 and counsel (G2) allow it. Bulk import needs none of it.
  discovery:
    enabled: false
    sources: {}
    # Accounts discovery adds a day, for testing; 0 = no cap (production).
    max_new_per_day: 0
    # The API client discovered accounts are registered to (created by tks
    # with no usable key).
    client: discovery
    # Part B (discovery-plan §7): the persister records the people a
    # monitored account's new posts, bio and comments bring in (sources
    # mention, reply, commenter); the leader counts this many at a time.
    count_batch: 5000
    # The entry check (discovery-plan §4): one read of a found account's
    # post list. Public, a post within active_for and the Iraq score passes:
    # added (at the admission pace). Private, quiet or gone: the dormant
    # list, read again only when found again after recheck_after.
    entry:
      active_for: 2160h       # 90 days (owner, 2026-11-04)
      recheck_after: 4320h    # 180 days (owner, 2026-11-04)
      batch: 200              # found accounts sent to their check per tick
      max_running: 500        # entry checks running fleet-wide (lane p2)
      max_attempts: 3         # failed reads before the account is dormant as unreadable
      posts: 15               # newest stored posts the score reads (one list page)
    # The Iraq score (discovery-plan §3): each kind of signal counts once.
    # One strong signal passes, so do two different medium ones; weak ones
    # add at most weak_max. The owner tunes these from samples in testing.
    score:
      strong: 1.0     # posts made in Iraq; Iraq or an Iraqi place in the bio or name; +964 phone; .iq link
      medium: 0.5     # Iraqi places in a caption; followed, mentioned or replied to by monitored accounts; shown in Iraq
      weak: 0.1       # writes in Arabic or Kurdish; comments on or follows monitored accounts
      weak_max: 0.3
      pass: 1.0
      regions: [IQ]
      caption_posts_strong: 3   # captions naming Iraqi places in 3 of the posts read: strong
      audience_strong: 10       # an audience signal from 10 accounts or searches: strong
      languages: [ar, ckb, ku]
