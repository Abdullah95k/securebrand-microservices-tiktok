openapi: 3.1.0
info:
  title: tks - TikTok public account scraper API
  version: "1.0.0"
  description: |
    Scheduled and on-demand reads of public TikTok accounts (logged out): accounts with their
    username history, posts (videos and photo posts) with their metrics, comments and replies.
    All endpoints require `Authorization: Bearer tks_<prefix>_<secret>` (`tksctl apikey create`).
    Scopes: `jobs:write`, `accounts:write`, `data:read`, `pii:read`, `discovery:read`,
    `discovery:write`, `admin` (implies all).
    tks deletes nothing it collects and erases no one (owner, 2026-11-01; ADR 0007 §14).
    Errors use RFC 9457 problem documents (`application/problem+json`). A change (any method but
    GET, HEAD and OPTIONS) that a browser marks as sent from another site (`Sec-Fetch-Site:
    cross-site` or `same-site`) is refused with 403; programs send no such header.

    **The discovery review page** is served by tks-api at `/review/`, outside this API: static
    files that hold no data and call these endpoints with the key the viewer gives
    (docs/tiktok/discovery-plan.md §11).

    **Ids are strings.** TikTok's user, post, comment and music ids do not fit a JavaScript
    number, so they are JSON strings of digits, in requests and answers.

    **Personal data needs `pii:read`** (docs/tiktok ADR 0007 §6): an account's username,
    nickname, bio, bio link and avatar; a comment's text and its author's identity; whom a
    caption or a comment mentions; a post's link (it names the username); an original sound's
    author. Without the scope these fields are left out; `author_key` (a pseudonymous key of
    the person, the same in every answer) is always there.

    **Account references** (`{account}`, `account` fields): `id:<user id>`, `sec:<secUid>`,
    `u:<username>`, `@username`, a username, or a profile link, URL-escaped in a path. A bare
    number is a username (TikTok allows all-digit usernames); a user id needs `id:`. An account
    is found by its current or a former username.
servers:
  - url: /v1
security:
  - apiKey: []
paths:
  /jobs:
    post:
      summary: Read an account now (on-demand, priority lane p0)
      description: >-
        Requires `jobs:write`. Repeating a request with the same `Idempotency-Key` returns the original
        job (200). `mode` auto reads an account never read before in full (back 365 days or to its first
        post) and a known one incrementally (back to its newest stored post); `refresh` re-reads the
        posts of the last `max_age_days` for their metrics.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJob'}
            example: {account: "@example", mode: auto}
      responses:
        "202": {description: Job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "200": {description: Existing job for this Idempotency-Key, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "400": {$ref: '#/components/responses/Problem'}
        "422": {description: "An id: reference to an account tks has not read (TikTok cannot be read by user id alone)", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        "429":
          description: >-
            Too many running jobs for this client (api.max_running_p0_jobs_per_client), the fleet's
            on-demand capacity is reached (api.max_running_p0_jobs), or rate limited. Retry after the
            Retry-After seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    get:
      summary: List jobs (own jobs and the scheduled jobs of registered accounts; all jobs with admin)
      parameters:
        - {in: query, name: account, schema: {type: string}, description: "Filter by the job's account reference"}
        - {in: query, name: status, schema: {$ref: '#/components/schemas/JobStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
                  next_cursor: {type: string}
  /jobs/{id}:
    get:
      summary: Job status, live counters while running, coverage when done
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        "200": {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        "404": {$ref: '#/components/responses/Problem'}
  /jobs/{id}/cancel:
    post:
      summary: Cancel a running job (its creator or an admin; a scheduled job only an admin)
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        "202": {description: Cancelling}
        "404": {$ref: '#/components/responses/Problem'}
  /jobs/{id}/results:
    get:
      summary: Stream the job's data as NDJSON
      description: >-
        One `{"type":"account"}` line, then one `{"type":"post"}` line per post seen during the job,
        each followed by its `{"type":"comment"}` lines when `include=comments`. The last line is
        `{"type":"end"}` when the stream is whole, or `{"type":"error"}` when it stopped early: a client
        that sees neither lost the connection. Only the job's creator, a client registered to the account
        of a scheduled job, or an admin can read it.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {in: query, name: include, schema: {type: string, enum: [comments]}}
      responses:
        "200": {description: NDJSON stream, content: {application/x-ndjson: {schema: {type: string}}}}
        "409": {description: The job has not resolved its account yet}
  /accounts:
    post:
      summary: Register an account for scheduled checks
      description: >-
        Requires `accounts:write`. A new account waits for paced admission (`tt.admission`, the
        owner's accounts first; `GET /admission`), then its first scheduled job is its backfill (365
        days or to its first post), every later one a check every `interval_minutes` (2 h 45 min by
        default, so new posts are stored within 3 hours), with daily and weekly metrics walks. An
        account whose posts tks has read already is admitted at once. Registering again is safe: the
        schedule is kept (enabled if it was not, an explicit interval only shortens it), new labels
        are added and nothing is read twice. An account tks has read is one schedule however it is
        named. The options of the first registration stay. Registering lifts the caller's own block
        (see DELETE).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterAccount'}
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_ref: {type: string, description: The schedule's reference}
                  created: {type: boolean, description: The account was not registered before}
                  outcome: {type: string, enum: [added, joined, already], description: "added: a new schedule; joined: another client's schedule, the caller's registration added; already: the caller was registered"}
                  queued: {type: boolean, description: The first read waits for paced admission}
                  schedule: {$ref: '#/components/schemas/Schedule'}
        "400": {$ref: '#/components/responses/Problem'}
        "422": {description: "An id: reference to an account tks has not read"}
    get:
      summary: List registered accounts (the caller's; every account with admin), by reference
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {in: query, name: label, schema: {type: string}, description: The caller's own label}
        - {in: query, name: source, schema: {type: string, enum: [api, import, mention, reply, commenter, search, hashtag, sound, feed, related, following, follower]}, description: A way the account came to tks}
        - {in: query, name: queued, schema: {type: boolean}, description: Only accounts waiting for paced admission}
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Schedule'
                        - type: object
                          properties:
                            status: {type: string, description: The stored account's status, once read}
                            username: {type: string, description: "pii:read"}
                  next_cursor: {type: string}
  /accounts/import:
    post:
      summary: Register a list of accounts (bulk import), with a report
      description: >-
        Requires `accounts:write`. At most 1000 accounts a call (`tksctl accounts import` sends a file
        of any size). Each line is a username, `@username`, a profile or video link, a secUid,
        `u:`/`sec:`/`id:` reference, or `text` is a CSV with an `account` column and optional
        `labels` (separated by `|` or `;`), `interval` (minutes), `max_age_days` and `include_media`.
        Blank lines and `#` comments are skipped; zero-width and direction marks, byte-order marks,
        Windows line ends and full-width characters are removed; usernames are lowercased. Short
        links are not supported yet. Running it again is safe (lines done come back already
        monitored). `disable_missing` needs the whole list, so here it only runs dry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines: {type: array, items: {type: string}, maxItems: 1000}
                text: {type: string, description: A whole file instead of lines}
                labels: {type: array, items: {type: string}}
                dry_run: {type: boolean}
                disable_missing: {type: boolean, description: "Report (dry) the caller's registrations not in the list"}
                force: {type: boolean}
      responses:
        "200": {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/ImportReport'}}}}
        "400": {$ref: '#/components/responses/Problem'}
        "413": {$ref: '#/components/responses/Problem'}
  /accounts/imports/{batch}:
    parameters:
      - {in: path, name: batch, required: true, schema: {type: string, format: uuid}}
    get:
      summary: An import's accounts and what tks found since
      description: >-
        Requires `accounts:write` (the import's client, or admin). Each account's status: queued
        (waiting for admission), unread, active, inactive (no post for 90 days), private,
        unavailable or banned.
      parameters:
        - {in: query, name: problems, schema: {type: boolean}, description: Only accounts that turned out private, inactive or missing}
      responses:
        "200": {description: Accounts}
        "404": {$ref: '#/components/responses/Problem'}
  /imports:
    get:
      summary: Your imports, the newest first
      description: Requires `accounts:write`; an admin sees every client's. Each with its labels, dry run and counts.
      parameters:
        - {in: query, name: before, schema: {type: string, format: date-time}, description: The next_before of the previous page}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200": {description: '{imports, next_before}'}
        "400": {$ref: '#/components/responses/Problem'}
  /accounts/{account}:
    parameters: [{$ref: '#/components/parameters/Account'}]
    get:
      summary: The stored account and its schedule
      description: An account registered but not read yet has only its schedule.
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_ref: {type: string}
                  account: {$ref: '#/components/schemas/Account'}
                  schedule: {$ref: '#/components/schemas/Schedule'}
                  sources: {type: array, items: {$ref: '#/components/schemas/Source'}, description: Where the account came from, oldest first}
                  labels: {type: array, items: {type: string}, description: The caller's labels on its registration}
        "404": {$ref: '#/components/responses/Problem'}
    patch:
      summary: Change the account's schedule
      description: >-
        Requires `accounts:write` and a registration (or admin). The schedule is shared by every client
        registered to the account: while others are registered, a client may only have it checked more
        (enable it, shorten the interval); disabling it, slowing it or changing its options is the
        admin's (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ScheduleRequest'
                - type: object
                  properties:
                    options: {$ref: '#/components/schemas/CrawlOptions'}
      responses:
        "204": {description: Updated}
        "404": {$ref: '#/components/responses/Problem'}
        "409": {$ref: '#/components/responses/Problem'}
    delete:
      summary: Unregister the caller
      description: >-
        The removal is recorded as a block, so discovery never adds the account back; the caller's
        next registration of it lifts the block. The schedule is disabled once no client is
        registered. The account's data stays.
      responses:
        "204": {description: Unregistered}
  /accounts/{account}/usernames:
    parameters: [{$ref: '#/components/parameters/Account'}, {$ref: '#/components/parameters/Limit'}]
    get:
      summary: The account's username history, newest first (pii:read)
      responses:
        "200":
          description: Usernames
          content:
            application/json:
              schema:
                type: object
                properties:
                  usernames:
                    type: array
                    items:
                      type: object
                      properties:
                        username: {type: string}
                        first_seen_at: {type: string, format: date-time}
                        last_seen_at: {type: string, format: date-time}
  /accounts/{account}/snapshots:
    parameters: [{$ref: '#/components/parameters/Account'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
    get:
      summary: The account's history (a row when its names, counts or flags changed), newest first
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        captured_at: {type: string, format: date-time}
                        username: {type: string, description: "pii:read"}
                        nickname: {type: string, description: "pii:read"}
                        follower_count: {type: integer, format: int64}
                        following_count: {type: integer, format: int64}
                        heart_count: {type: integer, format: int64}
                        video_count: {type: integer, format: int64}
                        verified: {type: boolean}
                        private: {type: boolean}
                  next_cursor: {type: string}
  /accounts/{account}/follows:
    parameters: [{$ref: '#/components/parameters/Account'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
    get:
      summary: The people on the account's following or followers list (discovery part D), the newest first seen first
      description: >-
        Read by discovery part D when tt.discovery's following and follower
        sources are on. Who each person is needs pii:read; author_key is
        always there. TikTok's lists do not say when someone followed: the
        times are when tks first and last saw the link.
      parameters:
        - {in: query, name: direction, schema: {type: string, enum: [following, follower], default: follower}}
      responses:
        "200":
          description: Follow links
          content:
            application/json:
              schema:
                type: object
                properties:
                  direction: {type: string, enum: [following, follower]}
                  list:
                    type: object
                    description: The list's read state (absent before its first read)
                    properties:
                      state: {type: string, enum: [new, ok, hidden, gone, refused]}
                      status_code: {type: integer, format: int64, description: "TikTok's code for a list it would not serve"}
                      last_read_at: {type: string, format: date-time}
                      next_read_at: {type: string, format: date-time}
                      read_to_end: {type: boolean}
                      total: {type: integer, format: int64}
                      last_stop: {type: string, enum: [end, known, cap, stuck, hidden, gone, refused]}
                  follows:
                    type: array
                    items:
                      type: object
                      properties:
                        author_key: {type: string}
                        person:
                          type: object
                          description: "pii:read"
                          properties:
                            user_id: {type: string}
                            sec_uid: {type: string}
                            username: {type: string}
                            nickname: {type: string}
                            avatar_url: {type: string}
                            verified: {type: boolean}
                        private: {type: boolean}
                        video_count: {type: integer, format: int64}
                        follower_count: {type: integer, format: int64}
                        following_count: {type: integer, format: int64}
                        first_seen_at: {type: string, format: date-time}
                        last_seen_at: {type: string, format: date-time}
                  next_cursor: {type: string}
        "400": {$ref: '#/components/responses/Problem'}
  /accounts/{account}/posts:
    parameters: [{$ref: '#/components/parameters/Account'}]
    get:
      summary: The account's posts, newest first
      parameters:
        - {in: query, name: since, schema: {type: string, format: date-time}, description: Posted at or after}
        - {in: query, name: kind, schema: {type: string, enum: [video, photo]}}
        - {in: query, name: status, schema: {type: string, enum: [visible, unavailable, private]}, description: "unavailable: no longer public"}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts: {type: array, items: {$ref: '#/components/schemas/Post'}}
                  next_cursor: {type: string}
  /posts/{post}:
    parameters: [{$ref: '#/components/parameters/Post'}]
    get:
      summary: A post with its latest counts and comment coverage
      responses:
        "200": {description: Post, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        "404": {$ref: '#/components/responses/Problem'}
  /posts/{post}/comments:
    parameters: [{$ref: '#/components/parameters/Post'}]
    get:
      summary: The post's comments and replies, oldest first
      parameters:
        - {in: query, name: parent_id, schema: {type: string}, description: Replies of this top-level comment}
        - {in: query, name: depth, schema: {type: integer, enum: [0, 1]}, description: 0 top-level comments, 1 replies}
        - {in: query, name: status, schema: {type: string, enum: [visible, deleted]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: {type: array, items: {$ref: '#/components/schemas/Comment'}}
                  next_cursor: {type: string}
  /posts/{post}/metrics:
    parameters: [{$ref: '#/components/parameters/Post'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
    get:
      summary: The post's counts history, newest first (a row only when a count changed)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            captured_at: {type: string, format: date-time}
                        - $ref: '#/components/schemas/PostCounts'
                  next_cursor: {type: string}
  /posts/{post}/media:
    parameters: [{$ref: '#/components/parameters/Post'}, {$ref: '#/components/parameters/Limit'}]
    get:
      summary: The post's media (cover, video renditions, photos) and their download state
      responses:
        "200":
          description: Media
          content:
            application/json:
              schema:
                type: object
                properties:
                  media: {type: array, items: {$ref: '#/components/schemas/Media'}}
  /music/{music}:
    parameters:
      - {in: path, name: music, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      summary: A sound
      responses:
        "200":
          description: Music
          content:
            application/json:
              schema:
                type: object
                properties:
                  music_id: {$ref: '#/components/schemas/ID'}
                  title: {type: string}
                  author_name: {type: string, description: "pii:read (an original sound is named after its creator)"}
                  original: {type: boolean}
                  duration_ms: {type: integer, format: int64}
                  album: {type: string}
                  cover_media_id: {type: string, format: uuid}
                  copyrighted: {type: boolean}
                  commerce: {type: boolean}
                  first_seen_at: {type: string, format: date-time}
                  last_seen_at: {type: string, format: date-time}
        "404": {$ref: '#/components/responses/Problem'}
  /media/{media}:
    parameters:
      - {in: path, name: media, required: true, schema: {type: string, format: uuid}}
    get:
      summary: A media item and its download state
      responses:
        "200": {description: Media, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}
        "404": {$ref: '#/components/responses/Problem'}
  /admission:
    get:
      summary: The admission queue of new accounts
      description: >-
        Accounts registered and waiting for their first read, the admission rate (`tt.admission`, or
        derived from the request budget), the estimated finish, and what draining the queue within a
        day would take (IPs and signer pages, from Phase 0's measurements).
      responses:
        "200": {description: Queue}
  /discovery/keywords:
    get:
      summary: The discovery keywords (discovery:read)
      parameters:
        - {in: query, name: language, schema: {type: string, enum: [en, ar, ckb, kmr]}}
        - {in: query, name: group, schema: {type: string}}
        - {in: query, name: enabled, schema: {type: boolean}}
        - {in: query, name: after, schema: {type: integer}, description: The last id of the previous page}
        - {in: query, name: hits, schema: {type: boolean}, description: 'Add accounts_found: how many accounts the keyword''s searches found'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200": {description: Keywords}
    post:
      summary: Add a keyword (discovery:write)
      description: A spelling that folds to a keyword already listed in the language returns that one (200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, language]
              properties:
                term: {type: string}
                language: {type: string, enum: [en, ar, ckb, kmr]}
                group: {type: string}
                enabled: {type: boolean, default: true}
      responses:
        "201": {description: Added}
        "200": {description: Already listed}
        "400": {$ref: '#/components/responses/Problem'}
  /discovery/keywords/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer}}
    patch:
      summary: Turn a keyword on or off, or correct it (discovery:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term: {type: string}
                group: {type: string}
                enabled: {type: boolean}
      responses:
        "200": {description: Keyword}
        "404": {$ref: '#/components/responses/Problem'}
        "409": {$ref: '#/components/responses/Problem'}
  /discovery/accounts:
    get:
      summary: Accounts discovery found, with their entry check, Iraq score, evidence and sources (discovery:read)
      description: >-
        Every account a discovery source found and tks does not monitor, and those it added
        (docs/tiktok/discovery-plan.md §3, §4, §11). state=dormant is the dormant list (private, no post
        in 90 days, never posted, banned, gone or unreadable; read again only when found after
        next_check_at); state=not_iraqi holds the public, active accounts whose score does not pass
        (yet), closest to the threshold first with order=score. Each account has an id (tks's own,
        for removing it) and the sources that found it. The latest found first; counts gives every
        state's total. Usernames need pii:read.
      parameters:
        - {in: query, name: state, schema: {type: string, enum: [pending, checking, qualified, added, not_iraqi, dormant, blocked]}}
        - {in: query, name: source, schema: {type: string, enum: [mention, reply, commenter, search, hashtag, sound, feed, related, following, follower]}}
        - {in: query, name: via, schema: {type: string}, description: 'With source: what led to it (a keyword''s id for search, a monitored account''s user id for mention, reply and commenter)'}
        - {in: query, name: label, schema: {type: string}, description: 'A label on the account''s schedule: the caller''s, or any client''s for admin'}
        - {in: query, name: min_score, schema: {type: number}}
        - {in: query, name: max_score, schema: {type: number}}
        - {in: query, name: since, schema: {type: string, format: date-time}, description: First found at or after}
        - {in: query, name: until, schema: {type: string, format: date-time}, description: First found before}
        - {in: query, name: order, schema: {type: string, enum: [found, score], default: found}}
        - {in: query, name: after, schema: {type: string}, description: The next cursor of the previous page (same order)}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        "200": {description: 'Found accounts ({accounts, counts, next})'}
        "400": {$ref: '#/components/responses/Problem'}
  /discovery/accounts/{id}/remove:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer}, description: The found account's id}
    post:
      summary: Remove a found account for good (discovery:write)
      description: >-
        The review page's remove button (discovery-plan §11): the account is blocked for the
        caller, so no source adds it back (§5.5); discovery's own registration and the caller's are
        removed, and its schedule stops when no client is left on it. Its data stays. Registering
        the account again (POST /accounts) lifts the caller's block. Idempotent.
      responses:
        "200": {description: '{state: blocked, monitoring_stopped, still_monitored}'}
        "404": {$ref: '#/components/responses/Problem'}
  /discovery/stats:
    get:
      summary: Discovery's cost and capacity (discovery:read)
      description: >-
        Accounts found and added per source and UTC day (an account found by two sources counts
        under each), discovery's own reads per day by job kind (jobs, requests, wire bytes), found
        accounts by state, the admission queue with what draining it within a day takes, the
        switches, the daily test cap and the score's threshold (discovery-plan §11, §12).
      parameters:
        - {in: query, name: days, schema: {type: integer, minimum: 1, maximum: 31, default: 7}}
      responses:
        "200": {description: '{days, counts, admission, enabled, sources, max_new_per_day, score_pass}'}
        "400": {$ref: '#/components/responses/Problem'}
  /admin/operations:
    get:
      summary: TikTok's operations in the registry (admin)
      responses:
        "200": {description: Operations, each a variant of a call with its method, endpoint and check state}
  /admin/operations/{name}:
    put:
      summary: Set a registry entry (admin); crawlers pick it up on their next reload
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, friendly_name, parser, variables]
              properties:
                doc_id: {type: string, description: The variant label (web, web-signed, creator)}
                friendly_name: {type: string}
                variables: {type: object, description: The query string template, in order}
                parser: {type: string}
                parser_version: {type: integer}
                status: {type: string, enum: [candidate, active, fallback, retired]}
                priority: {type: integer}
                method: {type: string, enum: [GET, POST]}
                endpoint: {type: string}
                headers: {type: array, items: {type: object}}
      responses:
        "200": {description: Stored}
        "400": {$ref: '#/components/responses/Problem'}
  /admin/canary/runs:
    get:
      summary: The latest canary runs, newest first (admin)
      parameters:
        - {in: query, name: limit, schema: {type: integer, default: 20, maximum: 200}}
      responses:
        "200": {description: Runs}
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  parameters:
    JobID: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    Account: {in: path, name: account, required: true, schema: {type: string}, description: "An account reference (id:, sec:, u:, @username, username or link), URL-escaped"}
    Post: {in: path, name: post, required: true, schema: {$ref: '#/components/schemas/ID'}}
    Limit: {in: query, name: limit, schema: {type: integer, default: 50, maximum: 500}}
    Cursor: {in: query, name: cursor, schema: {type: string}, description: Opaque cursor from next_cursor}
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ID:
      type: string
      pattern: '^[0-9]+$'
      description: A TikTok id (64-bit), as a string
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    CrawlOptions:
      type: object
      properties:
        max_age_days: {type: integer, description: "Oldest post age (default tt.freshness.backfill_days, 365; capped by limits.max_age_cap_days)"}
        max_posts: {type: integer, format: int64}
        max_comments_per_post: {type: integer, format: int64, description: "Default tt.comments.max_per_post"}
        include_comments: {type: boolean}
        include_replies: {type: boolean}
        include_media: {type: boolean, description: "Download media (default tt.media.include: off)"}
        include_comment_media: {type: boolean}
        video_policy: {type: string, enum: [none, thumbnail, sd, hd]}
    CreateJob:
      allOf:
        - $ref: '#/components/schemas/CrawlOptions'
        - type: object
          required: [account]
          properties:
            account: {type: string, description: An account reference}
            mode: {type: string, enum: [auto, full, incremental, refresh], default: auto}
    ScheduleRequest:
      type: object
      properties:
        enabled: {type: boolean, default: true}
        interval_minutes: {type: integer, minimum: 30, maximum: 43200, description: "Time between checks (default tt.freshness.list_interval, 165)"}
    RegisterAccount:
      type: object
      required: [account]
      properties:
        account: {type: string, description: An account reference}
        schedule: {$ref: '#/components/schemas/ScheduleRequest'}
        options: {$ref: '#/components/schemas/CrawlOptions'}
        labels: {type: array, items: {type: string}, description: "The caller's labels (1 to 64 characters, no spaces or commas)"}
    Source:
      type: object
      properties:
        how: {type: string, enum: [api, import, mention, reply, commenter, search, hashtag, sound, feed, related, following, follower]}
        via: {type: string, description: "What led to it: an import batch, a keyword, an account"}
        first_at: {type: string, format: date-time}
        last_at: {type: string, format: date-time}
        seen: {type: integer}
        evidence: {type: object}
        score: {type: number}
    ImportReport:
      type: object
      properties:
        batch: {type: string, format: uuid}
        dry_run: {type: boolean}
        lines: {type: integer}
        added: {type: integer}
        joined: {type: integer, description: Monitored by another client; the caller's registration added}
        already_monitored: {type: integer}
        duplicates: {type: integer}
        not_accepted:
          type: array
          items:
            type: object
            properties:
              line: {type: integer}
              input: {type: string}
              reason: {type: string}
        queued: {type: integer}
        queue: {type: object, description: "The admission queue (GET /admission)"}
        disable_missing: {type: object}
    Schedule:
      type: object
      properties:
        account_ref: {type: string, example: "u:example"}
        user_id: {$ref: '#/components/schemas/ID'}
        enabled: {type: boolean}
        interval_seconds: {type: integer}
        next_run_at: {type: string, format: date-time}
        last_run_at: {type: string, format: date-time}
        last_success_at: {type: string, format: date-time}
        options: {$ref: '#/components/schemas/CrawlOptions'}
        consecutive_failures: {type: integer}
        posts_per_day: {type: number}
        last_post_at: {type: string, format: date-time}
        walks: {type: object, description: "Metrics walks done: depth in seconds to the time it ended"}
        last_job_id: {type: string, format: uuid}
        origin: {type: string, enum: [owner, discovery]}
        queued: {type: boolean, description: The first read waits for paced admission}
        admitted_at: {type: string, format: date-time}
        inactive_since: {type: string, format: date-time, description: "Found private, banned or gone since (lighter checks: tt.freshness.inactive)"}
    JobStatus:
      type: string
      enum: [running, cancelling, finalizing, completed, partial, failed, cancelled]
    Job:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        kind: {type: string, enum: [on_demand, scheduled, backfill]}
        lane: {type: string, enum: [p0, p1, p2]}
        mode: {type: string, enum: [full, incremental, refresh]}
        account_ref: {type: string, example: "u:example"}
        user_id: {$ref: '#/components/schemas/ID'}
        status: {$ref: '#/components/schemas/JobStatus'}
        params: {type: object}
        counters:
          type: object
          additionalProperties: {type: integer}
          description: posts, comments, replies, requests, media_queued, pages_fetched, threads_spawned, tasks_failed, ...
        completeness:
          type: object
          description: Comment coverage per job. "partial" jobs had a comment read cut by an error or a wall, a dead-lettered task or a stuck list walk.
        error: {type: object}
        pending_tasks: {type: integer}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Account:
      type: object
      properties:
        user_id: {$ref: '#/components/schemas/ID'}
        sec_uid: {type: string}
        username: {type: string, description: "pii:read"}
        nickname: {type: string, description: "pii:read"}
        bio: {type: string, description: "pii:read"}
        bio_link: {type: string, description: "pii:read; from the profile page only"}
        avatar_url: {type: string, description: "pii:read"}
        avatar_media_id: {type: string, format: uuid, description: "pii:read"}
        verified: {type: boolean}
        private: {type: boolean}
        organization: {type: boolean}
        language: {type: string}
        created_at: {type: string, format: date-time, description: The account's creation}
        username_modified_at: {type: string, format: date-time}
        nickname_modified_at: {type: string, format: date-time}
        follower_count: {type: integer, format: int64}
        following_count: {type: integer, format: int64}
        heart_count: {type: integer, format: int64}
        video_count: {type: integer, format: int64}
        likes_given_count: {type: integer, format: int64}
        friend_count: {type: integer, format: int64}
        author_key: {type: string, description: Hex HMAC of the user id (pseudonymous)}
        status: {type: string, enum: [active, private, unavailable, banned]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        profile_refreshed_at: {type: string, format: date-time}
        page_read_at: {type: string, format: date-time}
    PostCounts:
      type: object
      description: Exact below 10,000; TikTok rounds larger counts to 3 or 4 significant digits (T31)
      properties:
        play_count: {type: integer, format: int64}
        like_count: {type: integer, format: int64}
        comment_count: {type: integer, format: int64, description: Top-level comments and replies, as TikTok counts them}
        share_count: {type: integer, format: int64}
        save_count: {type: integer, format: int64}
        repost_count: {type: integer, format: int64}
    Post:
      type: object
      properties:
        post_id: {$ref: '#/components/schemas/ID'}
        user_id: {$ref: '#/components/schemas/ID'}
        created_at: {type: string, format: date-time}
        kind: {type: string, enum: [video, photo]}
        url: {type: string, description: "pii:read (it names the username)"}
        caption: {type: string}
        text_ranges:
          type: array
          description: Hashtags and mentions in UTF-16 units; a mention's name and person need pii:read (author_key stays)
          items: {type: object}
        hashtags: {type: array, items: {type: string}}
        duration_ms: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        cover_media_id: {type: string, format: uuid}
        photo_count: {type: integer}
        music_id: {$ref: '#/components/schemas/ID'}
        is_pinned: {type: boolean, description: Known only from list reads}
        is_ad: {type: boolean}
        labels: {type: object, description: "AI-generated, warnings, anchors, as TikTok serves them"}
        comments_disabled: {type: boolean}
        region: {type: string}
        text_language: {type: string}
        discovered_via: {type: string, enum: [list, post_page, search, hashtag]}
        counts: {$ref: '#/components/schemas/PostCounts'}
        comments_collected: {type: integer, format: int64}
        replies_collected: {type: integer, format: int64}
        completeness: {type: number, description: Collected comments and replies over TikTok's count}
        comments_state: {type: string, enum: [none, partial, complete, truncated]}
        comments_synced_at: {type: string, format: date-time}
        status:
          type: string
          enum: [visible, unavailable, private]
          description: "unavailable: no longer public (a list covering its date stopped returning it and its page confirmed it); never deleted, and its content stays"
        unavailable_since: {type: string, format: date-time, description: When it was found no longer public}
        status_code: {type: integer, format: int64, description: "The statusCode its page answered when found unavailable (10216: made private)"}
        status_region: {type: string, description: The region of the exit that read its page}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
    Comment:
      type: object
      properties:
        comment_id: {$ref: '#/components/schemas/ID'}
        post_id: {$ref: '#/components/schemas/ID'}
        parent_comment_id: {$ref: '#/components/schemas/ID'}
        reply_to_comment_id: {$ref: '#/components/schemas/ID'}
        depth: {type: integer, enum: [0, 1]}
        author_key: {type: string, description: Hex HMAC of the author's user id (pseudonymous)}
        author:
          type: object
          description: "pii:read; absent when stored pseudonymized"
          properties:
            user_id: {$ref: '#/components/schemas/ID'}
            sec_uid: {type: string}
            username: {type: string}
            nickname: {type: string}
            avatar_url: {type: string}
            verified: {type: boolean}
            predicted_age_group: {type: string, description: "TikTok's inference of the person's age band, when it serves one"}
        text: {type: string, description: "pii:read"}
        text_ranges: {type: array, items: {type: object}, description: "pii:read"}
        created_at: {type: string, format: date-time}
        like_count: {type: integer, format: int64}
        reply_count: {type: integer, format: int64}
        liked_by_creator: {type: boolean}
        pinned_by_creator: {type: boolean}
        has_images: {type: boolean}
        image_media_ids: {type: array, items: {type: string, format: uuid}, description: "pii:read"}
        labels: {type: array, items: {type: string}}
        language: {type: string}
        status:
          type: string
          enum: [visible, deleted]
          description: >-
            deleted: a whole read of the post no longer returned this top-level comment (or its parent).
            The last content seen is kept; a later sighting makes it visible again.
        deleted_at: {type: string, format: date-time}
        edit_count: {type: integer, description: Text changes seen across reads}
        edited_at: {type: string, format: date-time}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
    Media:
      type: object
      properties:
        media_id: {type: string, format: uuid}
        source_media_id: {type: string}
        kind: {type: string, enum: [cover, origin_cover, dynamic_cover, video, photo, avatar, music_cover, comment_image]}
        variant: {type: string, enum: [original, sd, hd, thumbnail]}
        user_id: {$ref: '#/components/schemas/ID'}
        post_id: {$ref: '#/components/schemas/ID'}
        music_id: {$ref: '#/components/schemas/ID'}
        comment_id: {$ref: '#/components/schemas/ID'}
        position: {type: integer}
        author_key: {type: string}
        source_url: {type: string, description: "TikTok's signed link; a person's avatar or comment image needs pii:read"}
        source_expires_at: {type: string, format: date-time}
        width: {type: integer}
        height: {type: integer}
        duration_ms: {type: integer, format: int64}
        bitrate: {type: integer, format: int64}
        mime: {type: string}
        status: {type: string, enum: [discovered, stored, ready, deleted, expired, source_expired, failed, skipped]}
        s3_bucket: {type: string}
        s3_key: {type: string}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string}
        delete_after: {type: string, format: date-time}
        discovered_at: {type: string, format: date-time}
        stored_at: {type: string, format: date-time}
        ready_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
