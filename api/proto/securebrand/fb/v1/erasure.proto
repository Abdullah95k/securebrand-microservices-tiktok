syntax = "proto3";

package securebrand.fb.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-igs/gen/go/securebrand/fb/v1;fbv1";

enum SubjectType {
  SUBJECT_TYPE_UNSPECIFIED = 0;
  SUBJECT_TYPE_AUTHOR = 1;
  SUBJECT_TYPE_PAGE = 2;
}

// ErasureEvent is published on fb.erasure.v1. Every downstream consumer that
// stores scraped data must delete the subject's data when it receives one.
message ErasureEvent {
  string event_id = 1;
  string request_id = 2;
  SubjectType subject_type = 3;
  bytes author_key = 4;
  int64 page_id = 5;
  google.protobuf.Timestamp requested_at = 6;
  google.protobuf.Timestamp completed_at = 7;
}
