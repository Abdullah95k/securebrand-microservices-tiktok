syntax = "proto3";

package securebrand.tt.v1;

import "google/protobuf/timestamp.proto";
import "securebrand/common/v1/common.proto";
import "securebrand/tt/v1/common.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-tiktok/gen/go/securebrand/tt/v1;ttv1";

enum PostKind {
  POST_KIND_UNSPECIFIED = 0;
  POST_KIND_VIDEO = 1;
  // A photo post (imagePost): photos and a sound, no playable video.
  POST_KIND_PHOTO = 2;
}

enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_STATUS_VISIBLE = 1;
  // No longer public: a list read covering its date no longer returned it
  // and its page confirmed it. A logged-out reader cannot tell a deletion
  // from a post made private or removed by TikTok, so it is never "deleted"
  // (docs/tiktok/discovery-plan.md §17).
  POST_STATUS_UNAVAILABLE = 2;
  POST_STATUS_PRIVATE = 3;
}

// How the post was first found: an account's list or post page, or one of
// discovery part C's sources (docs/tiktok/discovery-plan.md §8, ADR 0007
// §27): a keyword search, a hashtag's or a sound's posts, the For You feed,
// a post's related posts. A stored post keeps the way it was first found.
enum DiscoveredVia {
  DISCOVERED_VIA_UNSPECIFIED = 0;
  DISCOVERED_VIA_LIST = 1;
  DISCOVERED_VIA_SEARCH = 2;
  DISCOVERED_VIA_HASHTAG = 3;
  DISCOVERED_VIA_POST_PAGE = 4;
  DISCOVERED_VIA_SOUND = 5;
  DISCOVERED_VIA_FEED = 6;
  DISCOVERED_VIA_RELATED = 7;
  // An account's reposts tab (discovery's reposts source, M19).
  DISCOVERED_VIA_REPOST = 8;
}

// PostFind is where discovery part C found a post (M12): the source
// (search, hashtag, sound, feed, related), what it read (the keyword's id,
// the hashtag's or sound's id, the post whose related posts these are, the
// feed's UTC day), the region TikTok served the read in (the exit's), and
// the post's place in the read.
message PostFind {
  string source = 1;
  string via = 2;
  string region = 3;
  int32 page = 4;
  int32 position = 5;
}

// Counts are a post's counts as TikTok serves them (statsV2, else stats).
// Logged out, counts of 10,000 and more come rounded to 3 or 4
// significant digits, on lists and post pages alike (M4, T31).
message PostCounts {
  optional int64 plays = 1;
  optional int64 likes = 2;
  optional int64 comments = 3;
  optional int64 shares = 4;
  // collectCount
  optional int64 saves = 5;
  optional int64 reposts = 6;
}

message Hashtag {
  // The challenge id; 0 when only textExtra named it.
  int64 id = 1;
  string name = 2;
}

message Photo {
  string media_id = 1;
  int32 position = 2;
  int32 width = 3;
  int32 height = 4;
}

// Labels TikTok puts on a post, as served.
message PostLabels {
  // ShowAIGC: labelled AI-generated.
  optional bool ai_generated = 1;
  // aigcLabelType, when present.
  optional int32 aigc_label_type = 2;
  // warnInfo entries' texts.
  repeated string warnings = 3;
  // anchors (links to products, places, effects), as served.
  string anchors_json = 4;
  // AIGCDescription: the creator's own text about AI in the post, as
  // served (empty on most posts).
  string ai_description = 5;
}

// Post is published on tt.post.v1, keyed by post_id, when a post is read in
// full (from the list or its page), so created_at is always set.
//
// A post that is no longer public is published as a Post with status
// UNAVAILABLE and only post_id, user_id, created_at, status, status_code,
// status_region and obs set: keep the content you already have. A later
// full read with status VISIBLE means it came back.
message Post {
  securebrand.common.v1.Observation obs = 1;
  int64 post_id = 2;
  // The monitored account.
  int64 user_id = 3;
  PostKind kind = 4;
  google.protobuf.Timestamp created_at = 5;
  // desc: the account's own text, not gated (ADR 0007 §6).
  string caption = 6;
  repeated Hashtag hashtags = 7;
  repeated TextRange text_ranges = 8;
  int64 duration_ms = 9;
  int32 width = 10;
  int32 height = 11;
  string cover_media_id = 12;
  repeated Photo photos = 13;
  optional int64 music_id = 14;
  // isPinnedItem; known only from list reads.
  optional bool pinned = 15;
  optional bool ad = 16;
  PostLabels labels = 17;
  // CategoryType.
  optional int32 category = 18;
  string playlist_id = 19;
  // itemCommentStatus != 0.
  optional bool comments_disabled = 20;
  // locationCreated: the region the post was made in.
  string region = 21;
  string text_language = 22;
  PostCounts counts = 23;
  PostStatus status = 24;
  DiscoveredVia discovered_via = 25;
  // With status UNAVAILABLE: the statusCode the post's page answered (10216
  // for a post made private; T6), and the region of the exit that read it
  // (the page's app context), since what TikTok shows depends on it (T23,
  // T30).
  optional int64 status_code = 26;
  string status_region = 27;
  // imagePost.title: a photo post's own title, apart from its caption.
  string title = 28;
  // The subtitle tracks the video's item lists (video.subtitleInfos), in
  // TikTok's order; their texts go on tt.subtitle.v1.
  repeated SubtitleInfo subtitles = 29;
  // Set when discovery part C found the post (the read's own, not stored
  // on the post): the persister records its author as a find.
  PostFind find = 30;
}

// PostMetrics is published on tt.post_metrics.v1, keyed by post_id, when a
// read finds a post's counts changed.
message PostMetrics {
  securebrand.common.v1.Observation obs = 1;
  int64 post_id = 2;
  int64 user_id = 3;
  google.protobuf.Timestamp post_created_at = 4;
  google.protobuf.Timestamp captured_at = 5;
  PostCounts counts = 6;
}
