# Local overrides (mounted into every service). Fast pacing is fine against
# fakett; NEVER use these rates against TikTok.
service: {env: dev}
log: {level: info, format: text}
tt:
  identity_rps: 20
  identity_burst: 5
  account_rps: 20
  account_rps_p0: 20
  global_rps: 200
  capture_raw: failures
  browser:
    no_sandbox: true
  signer:
    pages: 1
  canary:
    accounts: [account_0]   # fakett's
    interval: 10m
crawler:
  slots: 48
  lanes: {p0: 48, p1: 48, p2: 20}
  lane_min: 4
scheduler:
  budget:
    stretch_tiers: []
