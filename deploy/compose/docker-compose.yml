# Local stack: infrastructure + every tks service + fakett (a synthetic
# TikTok). It never reaches TikTok.
#   make compose-up        build the images and start everything
#   make compose-down
# Ports are published on 127.0.0.1 only: the passwords are the defaults,
# and Docker's published ports go around a host firewall.
# fakett refuses unsigned comment and reply calls, as TikTok does, so the
# crawler (the browser image) signs them in its signer pages, as in
# production (build brief D11).
name: tks

x-tks: &tks
  image: ${TKS_IMAGE:-tks:dev}
  restart: unless-stopped
  # A stop lets in-flight work finish and commits it (the crawler drains for
  # up to 75s); Docker's default 10s would kill it mid-drain and every task
  # running would be redone.
  stop_grace_period: 100s
  environment: &tks-env
    TKS_CONFIG: /etc/tks/local.yaml
    TKS_POSTGRES__DSN: postgres://tks:tks@postgres:5432/tks?sslmode=disable
    TKS_REDIS__ADDR: valkey:6379
    TKS_KAFKA__BROKERS: redpanda:9092
    TKS_KAFKA__SCHEMA_REGISTRY__URL: http://redpanda:8081
    TKS_S3__ENDPOINT: s3:9000
    TKS_TT__BASE_URL: http://fakett:8090
  volumes:
    - ./local.yaml:/etc/tks/local.yaml:ro
  depends_on:
    init: {condition: service_completed_successfully}
    topics: {condition: service_completed_successfully}
    valkey: {condition: service_healthy}

services:
  postgres:
    image: postgres:18-alpine
    environment: {POSTGRES_USER: tks, POSTGRES_PASSWORD: tks, POSTGRES_DB: tks}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "tks"], interval: 2s, retries: 30}
    volumes: [pgdata:/var/lib/postgresql]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --mode dev-container --smp 1 --memory 1G
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    # 18081: Redpanda's Schema Registry (kafka.schema_registry.url).
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:18081:8081"]
    healthcheck: {test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"], interval: 3s, retries: 30}

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, retries: 30}

  # In-memory S3 for development. Swap for MinIO/SeaweedFS/AWS S3 by changing
  # TKS_S3__ENDPOINT and credentials.
  s3:
    image: ${TKS_IMAGE:-tks:dev}
    entrypoint: ["/usr/local/bin/devs3", "--addr", ":9000"]
    ports: ["127.0.0.1:9000:9000"]

  fakett:
    image: ${TKS_IMAGE:-tks:dev}
    entrypoint: ["/usr/local/bin/fakett", "--addr", ":8090", "--accounts", "5", "--posts", "30", "--require-signature"]
    ports: ["127.0.0.1:8090:8090"]

  init:
    image: ${TKS_IMAGE:-tks:dev}
    environment: *tks-env
    volumes:
      - ./local.yaml:/etc/tks/local.yaml:ro
    entrypoint: ["/usr/local/bin/tksctl", "migrate", "up"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  topics:
    image: ${TKS_IMAGE:-tks:dev}
    environment: *tks-env
    volumes:
      - ./local.yaml:/etc/tks/local.yaml:ro
    entrypoint: ["/usr/local/bin/tksctl", "kafka", "apply", "--partitions-cap", "3", "--replicas", "1"]
    depends_on:
      redpanda: {condition: service_healthy}

  schemas:
    image: ${TKS_IMAGE:-tks:dev}
    environment: *tks-env
    volumes:
      - ./local.yaml:/etc/tks/local.yaml:ro
    entrypoint: ["/usr/local/bin/tksctl", "schemas", "apply"]
    depends_on:
      redpanda: {condition: service_healthy}

  api:
    <<: *tks
    entrypoint: ["/usr/local/bin/tks-api"]
    ports: ["127.0.0.1:8080:8080"]

  scheduler:
    <<: *tks
    entrypoint: ["/usr/local/bin/tks-scheduler"]

  # Every stage in one process, with Chromium for the signer's pages.
  crawler:
    <<: *tks
    image: ${TKS_BROWSER_IMAGE:-tks:dev-browser}
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/tks-crawler", "--stages", "account,post,thread,retry"]

  persister:
    <<: *tks
    entrypoint: ["/usr/local/bin/tks-persister"]

  media-downloader:
    <<: *tks
    entrypoint: ["/usr/local/bin/tks-media-downloader"]

  canary:
    <<: *tks
    image: ${TKS_BROWSER_IMAGE:-tks:dev-browser}
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/tks-canary"]

volumes:
  pgdata: {}
