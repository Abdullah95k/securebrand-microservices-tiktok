# Staging values: the whole chart against fakett (a synthetic TikTok) and
# small single-instance infrastructure, to rehearse an install end to end.
#
#   helm install tks deploy/helm/tks -f deploy/helm/tks/examples/fakett.yaml \
#     --set image.browserTag=<tag of the --target browser image>
#
# Expects, in the release namespace: Services postgres:5432, redpanda:9092,
# valkey:6379, s3:9000 (any S3; the image's /usr/local/bin/devs3 is an
# in-memory one) and fakett:8090 (the image's /usr/local/bin/fakett, run
# with --require-signature so tks-signer's pages sign comments and
# replies), and a Secret tks-env with TKS_POSTGRES__DSN,
# TKS_S3__ACCESS_KEY, TKS_S3__SECRET_KEY and TKS_PRIVACY__AUTHOR_HMAC_KEY.
# scripts/chart-smoke.py runs exactly these values in Docker.
config:
  service: {env: staging}
  kafka:
    brokers: ["redpanda:9092"]
  redis:
    addr: "valkey:6379"
  s3:
    endpoint: "s3:9000"
    use_ssl: false
    region: "us-east-1"
    media_bucket: "tks-media"
    raw_bucket: "tks-raw"
  tt:
    base_url: "http://fakett:8090"
    # fakett's pace; NEVER use these rates against TikTok.
    identity_rps: 20
    identity_burst: 5
    account_rps: 20
    account_rps_p0: 20
    global_rps: 200
    proxy:
      tiers: [{name: direct, kind: direct}]
      routing: {default: [direct]}
    signer:
      pages: 1
    # fakett's synthetic accounts (internal/fakett: account_0, account_1...).
    canary:
      accounts: [account_0]
      interval: 10m
    # Exercises tks-media-downloader; off in production until the analysis
    # service exists (D5).
    media:
      include: true

# No proxies file: the direct tier above reaches fakett.
secretFiles:
  existingSecret: ""

# No KEDA in a rehearsal cluster: fixed replicas.
keda:
  enabled: false

hooks:
  topicReplicas: 1
  # One small broker: production's partition counts (about 600) would leave
  # no room for __consumer_offsets, and no consumer group could start.
  topicPartitionsCap: 3

components:
  api: {replicas: 1, pdb: null, resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}}
  scheduler: {replicas: 1, pdb: null, resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}}
  crawler-account: {replicas: 1, pdb: null, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}}
  crawler-post: {replicas: 1, pdb: null, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}}
  crawler-thread: {replicas: 1, pdb: null, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}}
  crawler-retry: {replicas: 1}
  persister: {replicas: 1, pdb: null, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}}
  media-downloader: {replicas: 1, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}}
  canary: {replicas: 1, resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}}
  # One page (config.tt.signer.pages above): half production's memory.
  signer: {replicas: 1, resources: {requests: {cpu: 100m, memory: 1Gi}, limits: {cpu: "1", memory: 1Gi}}}
