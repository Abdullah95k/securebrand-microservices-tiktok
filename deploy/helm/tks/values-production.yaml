# tks on the production platform (M18; docs/tiktok/production-handover.md,
# runbook docs/runbooks/tks-production.md). Layered over values.yaml:
#
#   helm template tks deploy/helm/tks -n tks -f deploy/helm/tks/values-production.yaml \
#     --set image.tag=<commit> --set image.browserTag=<commit> --set image.backupTag=<commit>
#
# Namespace tks holds, from the platform:
#   - Secret platform-credentials: POSTGRES_*, KAFKA_*, VALKEY_*, S3_*,
#     SCHEMA_REGISTRY_URL, S3_BUCKET_BACKUPS (mapped below with valueFrom,
#     platformSecret);
#     each component's Postgres role as POSTGRES_<ROLE>_USER and _PASSWORD
#     for API, READER, PERSISTER, SCHEDULER and CRAWLER;
#   - Secret proxies, key proxies.yaml: tt.proxy.tiers in tks's format,
#     each tier with its country;
# and, made once for tks (never in git): Secret tks-env with
# TKS_PRIVACY__AUTHOR_HMAC_KEY (openssl rand -hex 32, never changed).
# The canary accounts are below (config.tt.canary.accounts), not in tks-env:
# a TKS_TT__CANARY__ACCOUNTS there would replace them, and an empty one
# would leave the canary with none.

image:
  # The platform builds the three images from a commit of this repository and
  # keeps them in its registry; the tags are that commit's full SHA.
  repository: registry.digitalocean.com/securebrand/tks
  tag: ""
  browserRepository: registry.digitalocean.com/securebrand/tks-browser
  browserTag: ""
  backupRepository: registry.digitalocean.com/securebrand/tks-backup
  backupTag: ""

platformSecret:
  name: platform-credentials
  roles: true

secretEnv:
  existingSecret: tks-env
secretFiles:
  existingSecret: proxies
  key: proxies.yaml

config:
  service: {env: prod}
  # Brokers, Valkey, Postgres and the object store come from
  # platform-credentials; these are what the Secret does not say.
  # Production's PostgreSQL is reached through PgBouncer in transaction
  # mode, max_connections 50 for every service (the master, 2026-11-07):
  # a small pool per process, short transactions.
  postgres:
    max_conns: 4
  kafka:
    brokers: []
  s3:
    endpoint: ""
    use_ssl: true
    # The platform owns the buckets and expires tks/30d/ after 30 days.
    create_buckets: false
    media_prefix: "tks/"
    raw_keep_prefix: "tks/keep/"
    raw_rest_prefix: "tks/30d/"
    # Dumps under tks/postgres/ in S3_BUCKET_BACKUPS (the backup job).
    backup_prefix: "tks/"
  tt:
    # Page loads (an identity's bootstrap: its profile page, HTML) are
    # paced on each static exit (the ISP tier), and an exit whose page load
    # is walled (a checkpoint) loads no page for 30 min, doubling up to
    # 4 h, while its API calls go on. A precaution: the 2026-11-07 STOP's
    # checkpoints were all on res_iq (a gateway, which this gate does not
    # cover; see tt.discovery.sources); the ISP page loads stayed ok. The
    # gate is per pod, so the fleet's rate is this times the crawler pods.
    proxy:
      page_loads:
        interval: 20m
        backoff: 30m
        max_backoff: 4h
    # Failures and a 1 % sample of good answers, kept for good under
    # tks/keep/ (all would also keep every other answer under tks/30d/).
    capture_raw: sample
    capture_raw_sample: 0.01
    # The shared contract's content.* events (M15a): on since 2026-11-07,
    # once the platform had made the twelve shared topics and tks-kafka's
    # ACLs (hand-over §6); production's checks. What was stored before
    # goes out with `tksctl content export`.
    content:
      enabled: true
      production: true
    # Videos' subtitle texts (M17) go on tt.subtitle.v1, which the platform
    # makes (hand-over §6): on once it exists. A crawler producing to a
    # missing topic would retry its tasks until the topic is made.
    subtitles:
      include: false
    # Media files for the analysis service (owner, 2026-11-10): downloaded
    # from TikTok's CDN over the downloader's own egress, and deleted by its
    # sweeper once sb-analysis acknowledged them, or 72 h after storing
    # (M20; tks-media.md). On together with the sweeper, in one pin.
    media:
      include: true
      # Every kind but music_cover (the master, 2026-11-11): sb-analysis
      # skips music covers by policy, so they only added about 10k files
      # every 3 h to its backlog. Their metadata is still published.
      kinds: [cover, origin_cover, dynamic_cover, video, photo, avatar, comment_image]
    canary:
      # The owner's canary accounts (public accounts that post often and get
      # comments with replies; tks-canary.md) are set by the platform as
      # parameters of tks's Argo CD application, config.tt.canary.accounts[0],
      # [1] and [2] (the master, 2026-11-07, as igs's D-033): real usernames
      # stay out of this public repository. Empty here; tks-canary refuses to
      # start without them.
      accounts: []
    # New accounts' first reads (365 days of posts and comments, about
    # 1,500 requests each, 95 % signed) start at this pace, so the canary
    # list's do not all start at once (tks-production.md §3). 6 an hour is
    # about 9,000 requests an hour: well inside one tks-signer replica's
    # 2 pages (C4: about 322,000 signatures a day) beside the monitoring.
    # 0 would admit every new account at once (no request budget is set).
    # 12 an hour (about 18,000 requests an hour) with two tks-signer
    # replicas (4 pages; C4: 2 pages sign about 322,000 a day), the owner's
    # list first, then discovered accounts by score (2026-11-07).
    admission:
      per_hour: 12
    # Discovery (owner, 2026-11-07; runbook tks-discovery.md): part B (who
    # monitored accounts mention, answer, or who comments on them) and part
    # C (hashtags, sounds and related posts on isp; keyword search and the
    # For You feed on res_iq, TikTok's view from Iraq, T37). res_iq is
    # residential, billed by the GB (3 GB to start): search once a day at
    # 2 pages a keyword and the feed 4 times a day at 3 reads keep it near
    # 1.5 GB a month (tks_proxy_bytes_total{tier="res_iq"} gives the real
    # figure). Found accounts are checked once and those that pass join the
    # admission queue behind the owner's; at most 100 a day while the first
    # list settles. Load the keyword list once: tksctl discovery keywords
    # seed.
    discovery:
      enabled: true
      max_new_per_day: 100
      # Search and feed are off (2026-11-07 STOP): on res_iq, each of their
      # tasks bootstrapped a new identity with a profile page through the
      # residential gateway (a new exit each time), TikTok checkpointed
      # those page loads (809 in 2 h), and each checkpoint retried on yet
      # another identity. The page-load gate does not cover a gateway. On
      # again only with a fix that bootstraps far less on res_iq.
      # repost (M19, owner D-047): monitored accounts' reposts tabs every
      # 7 days and each checked candidate's once, on the ISP tier.
      sources: {mention: true, reply: true, commenter: true, hashtag: true, sound: true, related: true, search: false, feed: false, repost: true}
      search:
        tier: res_iq
        every: 24h
        max_pages: 2
      feed:
        tier: res_iq
        every: 6h
        reads: 3
    cost:
      # The owner's prices and budget (2026-11-05), for tks_cost_* and
      # tksctl report.
      ip_month_usd: 3
      browser_hour_usd: 0.017
      compute_usd_per_account_day: 0.0002
      storage_gb_month_usd: 0.10
      budget_per_account_usd: 0.0019

# The platform owns the topics (REQ-020); tks registers no schema in a
# shared registry (standing instruction 2). Migrations run as the owner and
# grant the components' roles.
hooks:
  migrate: true
  topics: false
  schemas: false

keda:
  enabled: true
  bootstrapServersFromEnv: TKS_KAFKA__BROKERS
  authSecret: platform-credentials
  authKeys: {username: KAFKA_USER, password: KAFKA_PASSWORD, ca: KAFKA_CA_CERT}
  sasl: scram_sha256
  tls: enable

# The daily dump of schema tt (M16; docs/runbooks/tks-backup.md), 02:17
# Iraq time, as the read-only role.
backup:
  enabled: true
  postgresRole: reader

# Each component's role, and its maximum pods at most the partitions of
# the topics it reads (the platform's starting sizes: account lanes 3 each,
# post and thread lanes 3/6/3, tks.task.media 3, tt.* 3 at least).
components:
  api:
    postgresRole: api
    readRole: reader
  scheduler:
    postgresRole: scheduler
  crawler-account:
    postgresRole: crawler
    autoscale: {max: 3}
  crawler-post:
    postgresRole: crawler
    autoscale: {max: 3}
  crawler-thread:
    postgresRole: crawler
    autoscale: {max: 3}
  crawler-retry:
    postgresRole: crawler
  persister:
    postgresRole: persister
    autoscale: {max: 3}
  media-downloader:
    postgresRole: crawler
    autoscale: {max: 3}
  canary:
    postgresRole: crawler
  # The signer in its own capped Deployment, with no database.
  signer:
    enabled: true
    postgresRole: none
    # Two replicas, 2 pages each (the admission pace above). A page is
    # closed past 800 MB when idle and killed past 1,200 MB while it signs,
    # so two busy pages and the server can pass 2 GiB: the signer peaked at
    # 2,136 MB of its 2 Gi on 2026-11-11 (report 3 on 46f39fe). The limit is
    # 3 Gi; the request stays 2 Gi, so scheduling is unchanged.
    replicas: 2
    resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "1", memory: 3Gi}}
