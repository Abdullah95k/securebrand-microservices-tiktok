# Prometheus rules for tks. The chart ships them as a PrometheusRule
# (alerts.enabled); they are plain Prometheus rule groups and can be loaded
# as a rule file as well. Thresholds are starting points: tune them against
# the Phase 0 baseline (C4). internal/platform/metrics/monitoring_test.go checks
# every metric referenced here exists.
#
# Gauges the leader scheduler publishes (AIMD, budget, schedule lag,
# consumer lag) are read through tks:leader:* so a former leader's last
# values do not count.
groups:
  - name: tks.recording
    interval: 30s
    rules:
      - record: tks:tt_requests:rate5m
        expr: sum by (query, class, tier) (rate(tks_tt_requests_total[5m]))
      - record: tks:block_ratio:rate5m
        expr: |
          sum(rate(tks_tt_requests_total{class=~"rate_limited|login_wall|checkpoint"}[5m]))
            / clamp_min(sum(rate(tks_tt_requests_total{class!="transport"}[5m])), 1e-9)
      - record: tks:parse_drift_ratio:rate15m
        expr: |
          sum by (query) (rate(tks_parse_total{outcome="drift"}[15m]))
            / clamp_min(sum by (query) (rate(tks_parse_total[15m])), 1e-9)
      # How often each optional field is missing, per parsed response. The
      # drift baseline compares it with the same series a week earlier.
      - record: tks:parse_missing_per_response:rate1h
        expr: |
          sum by (query, field) (rate(tks_parse_missing_field_total[1h]))
            / on (query) group_left () clamp_min(sum by (query) (rate(tks_parse_total[1h])), 1e-9)
      - record: tks:registry_stale_ratio:rate10m
        expr: |
          sum by (query) (rate(tks_tt_requests_total{class="registry_stale", query!~"registry_sync:.*"}[10m]))
            / clamp_min(sum by (query) (rate(tks_tt_requests_total{query!~"registry_sync:.*"}[10m])), 1e-9)
      - record: tks:leader:aimd_ceiling_rps
        expr: max(tks_aimd_ceiling_rps * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:fleet_rps
        expr: max(tks_fleet_rps * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:fleet_block_rate
        expr: max(tks_fleet_block_rate * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:schedule_lag_seconds
        expr: max by (tier) (tks_schedule_lag_seconds * on (instance) group_left () (tks_scheduler_leader == 1))
      - record: tks:leader:budget_projected
        expr: max by (kind) (tks_budget_projected * on (instance) group_left () (tks_scheduler_leader == 1))
      - record: tks:leader:budget_limit
        expr: max by (kind) (tks_budget_limit * on (instance) group_left () (tks_scheduler_leader == 1))
      - record: tks:leader:budget_backfill_paused
        expr: max(tks_budget_backfill_paused * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:kafka_consumer_lag
        expr: max by (group, topic) (tks_kafka_consumer_lag * on (instance) group_left () (tks_scheduler_leader == 1))
      - record: tks:comment_completeness:p50_1h
        expr: histogram_quantile(0.5, sum by (le) (rate(tks_comment_completeness_ratio_bucket[1h])))

  - name: tks.traffic
    rules:
      - alert: TksBlockRateHigh
        expr: tks:block_ratio:rate5m > 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of TikTok answers are blocks"
          description: >-
            Rate limits, login walls, captchas and checkpoints are above 10%
            fleet-wide.
            AIMD should be lowering the ceiling; check which tier and exit
            buckets are affected.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#block-storm
      - alert: TksBlockRateCritical
        expr: tks:block_ratio:rate5m > 0.25
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value | humanizePercentage }} of TikTok answers are blocks"
          description: >-
            A quarter of responses are blocks even with AIMD backing off.
            Consider pinning the ceiling low and moving routing to another tier.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#block-storm
      - alert: TksCrawlersIdleWithBacklog
        # Tasks, not requests: tks-canary's own requests every hour would
        # otherwise keep resetting the for timer.
        expr: |
          sum(rate(tks_tasks_total[10m])) == 0
            and sum(tks:leader:kafka_consumer_lag{group=~"tks-tt-crawler-.*"}) > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: Crawlers finish no task while tasks are waiting
          description: >-
            No crawl task handled in 10 minutes with crawl tasks queued.
            Check the crawler pods, the AIMD ceiling (a pinned 0?), the proxy
            breakers and the budget.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#kafka-lag
      - alert: TksQueryBreakerOpen
        expr: max by (name) (tks_breaker_state{name=~"query:.*"}) == 2
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Breaker {{ $labels.name }} is open"
          description: >-
            The answers of this operation variant keep being refused or failing
            to parse, so it is not being sent. Expect tks-canary to promote
            another variant, or a parser fix.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#an-operation-is-failing
      - alert: TksProxyBucketOpen
        expr: max by (name) (tks_breaker_state{name=~"proxy:.*"}) == 2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Exit bucket {{ $labels.name }} has been open for 30 minutes"
          description: >-
            The bucket keeps failing its probes after cooldowns. Check the
            provider; remove the endpoints or route around the tier.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#block-storm

      - alert: TksBrowserFallbackSaturated
        expr: sum(rate(tks_bootstrap_total{method="browser", outcome=~"capped|busy"}[15m])) > 0.05
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Pages that need the browser fallback are turned away
          description: >-
            More profile pages carry no data (shell pages, T1) than
            tt.browser.max_share or max_concurrent allow; those bootstraps fail
            and their tasks retry.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#browser-fallback
      - alert: TksBrowserFallbackFailing
        expr: |
          sum(rate(tks_bootstrap_total{method="browser", outcome=~"error|no_tokens"}[30m]))
            / clamp_min(sum(rate(tks_bootstrap_total{method="browser", outcome=~"ok|error|no_tokens"}[30m])), 1e-9) > 0.5
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of browser bootstraps fail"
          description: Chromium fails to start or render, or the rendered pages carry no tokens either.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#browser-fallback

  - name: tks.registry
    rules:
      - alert: TksRegistryStale
        expr: tks:registry_stale_ratio:rate10m > 0.2
        for: 45m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.query }}: {{ $value | humanizePercentage }} of calls use a refused operation variant"
          description: >-
            TikTok refuses the active variant and tks-canary has not promoted
            a replacement within a run or two.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#an-operation-is-failing
      - alert: TksRegistryQueryFailing
        expr: min by (query) (tks_registry_query_healthy) == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.query }}: the active variant fails on the canary accounts and nothing can replace it"
          description: >-
            Stale with no working variant (TikTok may have moved the call,
            T25), or drift (the parser needs a fix). tks-canary's runs have
            the details.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#an-operation-is-failing
      - alert: TksSchemaDrift
        expr: tks:parse_drift_ratio:rate15m > 0.05
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.query }}: {{ $value | humanizePercentage }} of responses miss required fields"
          description: >-
            TikTok changed the answer's shape. Raw failing answers are in the
            raw bucket (tt.capture_raw: failures).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#schema-drift

      - alert: TksOptionalFieldDrift
        # TikTok renamed or dropped a field the parser treats as
        # optional: nothing fails, but the data loses it silently. Fires
        # when a field goes missing far more often than a week before, or
        # goes missing in many responses when it was never missing a week
        # before (the raw counter, which predates the recording rule).
        expr: |
          (
            tks:parse_missing_per_response:rate1h > 2 * (tks:parse_missing_per_response:rate1h offset 7d) + 0.05
            or (tks:parse_missing_per_response:rate1h > 0.25
                  unless on (query, field) sum by (query, field) (rate(tks_parse_missing_field_total[1h] offset 7d)))
          )
          and on (query) sum by (query) (rate(tks_parse_total[1h])) > 0.05
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.query }}: optional field {{ $labels.field }} missing in {{ $value | humanizePercentage }} of responses"
          description: >-
            Compared with a week ago. Look at captured answers (the raw bucket,
            with tt.capture_raw: all for a while) and add the field's new path
            to the parser (internal/tt/parse).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#schema-drift
      - alert: TksShadowParserDiffers
        expr: |
          sum by (query) (rate(tks_parse_shadow_total{outcome!="same"}[1h]))
            / clamp_min(sum by (query) (rate(tks_parse_shadow_total[1h])), 1e-9) > 0.01
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.query }}: the candidate parser disagrees on {{ $value | humanizePercentage }} of sampled responses"
          description: The differing answers are captured in the raw bucket; compare them before promoting the candidate.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#schema-drift

  - name: tks.pipeline
    rules:
      - alert: TksSchedulerNoLeader
        expr: (max(tks_scheduler_leader) < 1) or absent(tks_scheduler_leader)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: No tks-scheduler holds the leader lock
          description: >-
            Nothing plans scheduled checks, admits new accounts, finalises jobs,
            runs AIMD, the budget or the cost meter. Check the scheduler pods and their Postgres connection.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#stuck-jobs
      - alert: TksOnDemandLag
        expr: max by (group, topic) (tks:leader:kafka_consumer_lag{group=~"tks-tt-crawler-.*-p0"}) > 500
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.group }} is {{ $value }} on-demand tasks behind"
          description: >-
            On-demand work waits. KEDA should be scaling the stage; check its
            max replicas, the lane slots and the AIMD ceiling.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#kafka-lag
      - alert: TksPersisterLag
        expr: max by (topic) (tks:leader:kafka_consumer_lag{group="tks-tt-persister"}) > 50000
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "The persister is {{ $value }} records behind on {{ $labels.topic }}"
          description: Results reach Postgres late. Check tks_persist_batch_seconds and the database.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#kafka-lag
      - alert: TksPersisterQuarantine
        expr: sum by (entity, reason) (increase(tks_persist_quarantined_total[1h])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The persister set aside {{ $value }} {{ $labels.entity }} records in an hour ({{ $labels.reason }})"
          description: >-
            Records it could not write are in tks.persist.dlq (kept 7 days).
            Read the log lines for their SQLSTATE, fix the cause, then
            tksctl dlq replay --topic tks.persist.dlq.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#persister-quarantine
      - alert: TksHandlerPanics
        expr: sum by (group) (increase(tks_kafka_handler_panics_total[10m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.group }}: a record handler keeps panicking"
          description: >-
            The record is retried with backoff and its partition waits behind
            it (its lag grows). The handler's log line "kafka: handler
            panicked" names the topic, partition and offset and has the stack.
            Fix the bug; the record goes through once it no longer panics.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#kafka-lag
      - alert: TksDLQGrowing
        expr: sum by (stage, reason) (increase(tks_dlq_total[1h])) > 100
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} {{ $labels.stage }} tasks dead-lettered in an hour ({{ $labels.reason }})"
          description: The tasks are in tks.task.dlq (kept 14 days). Fix the cause and deploy, then tksctl dlq replay; otherwise the next scheduled check reads the account again.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#stuck-jobs
      - alert: TksJobsFailing
        expr: |
          sum(rate(tks_jobs_total{status="failed"}[30m]))
            / clamp_min(sum(rate(tks_jobs_total[30m])), 1e-9) > 0.10
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of jobs fail"
          description: Look at the failed jobs' error and the request classes of their queries.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#stuck-jobs
      - alert: TksAPIErrors
        expr: |
          sum(rate(tks_api_requests_total{code=~"5.."}[5m]))
            / clamp_min(sum(rate(tks_api_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of API requests fail with 5xx"
          description: Check the API logs and the read replica.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#key-signals

  - name: tks.coverage
    rules:
      - alert: TksScheduleLag
        expr: max by (tier) (tks:leader:schedule_lag_seconds) > 6 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Scheduled accounts of {{ $labels.tier }} are {{ $value | humanizeDuration }} overdue"
          description: >-
            The crawl capacity does not keep up with the schedule. Add crawler
            capacity (IPs, signer pages) or look at the budget.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#schedule-lag
      - alert: TksCommentCompletenessLow
        expr: tks:comment_completeness:p50_1h < 0.8
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: "Median comment completeness is {{ $value | humanizePercentage }}"
          description: >-
            Posts end with fewer comments than TikTok's comment count. Look at
            refused signed calls (TksSignedCallsRefused), walls and drift.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#key-signals
      - alert: TksDeletionChecksSkipped
        expr: |
          sum(rate(tks_deletion_checks_total{outcome=~"skipped_.*"}[6h]))
            / clamp_min(sum(rate(tks_deletion_checks_total[6h])), 1e-9) > 0.25
          and sum(increase(tks_deletion_checks_total[6h])) > 20
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of full comment reads look partial; deletions are not being detected"
          description: >-
            Full reads of known posts do not account for the comment count
            TikTok gives, so their posts are not checked for deleted comments.
            TikTok is likely serving partial comment lists.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-deploy.md#key-signals
      - alert: TksBudgetOverrun
        expr: |
          max by (kind) (tks:leader:budget_projected)
            > 1.1 * max by (kind) (tks:leader:budget_limit)
          and max by (kind) (tks:leader:budget_limit) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "The day's projected {{ $labels.kind }} exceed the budget by more than 10%"
          description: >-
            On-demand and scheduled traffic alone overrun the request or byte
            budget, even with backfill paused (tks stretches no tier).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a5-cost-per-account-per-day
      - alert: TksBackfillPausedLong
        expr: tks:leader:budget_backfill_paused == 1
        for: 12h
        labels: {severity: info}
        annotations:
          summary: The budget has held backfill back for 12 hours
          description: Backfills of new accounts make no progress, and no account is admitted. Raise the budget or reduce scheduled work.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a5-cost-per-account-per-day

  # tks's service objectives (docs/tiktok build brief §8): A1, the scheduled
  # checks that succeed; A2, the delay before a new post is stored. Measured
  # over a day, as the brief defines them; each needs some traffic first, so
  # a quiet stack does not page.
  - name: tks.objectives
    rules:
      - record: tks:leader:account_check_oldest_seconds
        expr: max(tks_account_check_oldest_seconds * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:account_refresh_overdue
        expr: max(tks_account_refresh_overdue * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:cost_per_account_usd
        expr: max(tks_cost_per_account_usd * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:cost_budget_per_account_usd
        expr: max(tks_cost_budget_per_account_usd * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:cost_budget_alert_share
        expr: max(tks_cost_budget_alert_share * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:cost_over_budget
        expr: max(tks_cost_over_budget * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:admission_queue
        expr: max(tks_admission_queue * on (instance) (tks_scheduler_leader == 1))
      - record: tks:leader:scheduled_accounts_active
        expr: max(tks_scheduled_accounts{status="active"} * on (instance) group_left () (tks_scheduler_leader == 1))
      - alert: TksChecksMissingWindow
        expr: |
          sum(increase(tks_checks_total{kind=~"check|walk", result=~"completed|partial", window="in"}[1d]))
            / clamp_min(sum(increase(tks_checks_total{kind=~"check|walk"}[1d])), 1e-9) < 0.99
          and sum(increase(tks_checks_total{kind=~"check|walk"}[1d])) > 100
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of the day's scheduled checks succeeded within their interval (A1: 99 %)"
          description: >-
            Scheduled list checks fail, are reaped, or end after the next one
            was due. Look at tks_checks_total by result and window, the
            crawler's lag and TikTok's answers.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a1-scheduled-checks
      - alert: TksAccountUncheckedLong
        expr: tks:leader:account_check_oldest_seconds > 6 * 3600
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "An active account has had no successful check for {{ $value | humanizeDuration }} (A1: 6 h)"
          description: >-
            At least one active account's checks keep failing or are not
            started. Find it by the oldest last_success_at in account_schedule.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a1-scheduled-checks
      - alert: TksAccountRefreshOverdue
        expr: |
          tks:leader:account_refresh_overdue / clamp_min(tks:leader:scheduled_accounts_active, 1) > 0.005
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of active accounts' daily refresh is more than a day overdue (A1: 0.5 %)"
          description: >-
            The profile page reads that give exact counts and the bio link do
            not succeed. Look at the account stage's page loads.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a1-daily-account-refresh
      - alert: TksAdmissionStalled
        expr: |
          tks:leader:admission_queue > 0 and sum(increase(tks_admitted_accounts_total[6h])) == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} new accounts wait for admission and none started in 6 h"
          description: >-
            Paced admission lets no new account start its first read: the
            budget leaves nothing after monitoring, or pauses backfills. Raise
            scheduler.budget.requests_per_day or set tt.admission.per_hour;
            GET /v1/admission says what draining the queue in a day takes.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-import.md#the-admission-queue
      - alert: TksNewPostsLate
        expr: |
          sum(increase(tks_post_store_delay_seconds_bucket{le="10800"}[1d]))
            / clamp_min(sum(increase(tks_post_store_delay_seconds_count[1d])), 1e-9) < 0.99
          and sum(increase(tks_post_store_delay_seconds_count[1d])) > 100
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of the day's new posts were stored within 3 h (A2: 99 %)"
          description: >-
            New posts reach Postgres late: checks run late or fail, the
            persister lags, or the budget stretches the checks.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a2-new-posts-stored-within-3-h
      - alert: TksNewPostsMedianLate
        expr: |
          histogram_quantile(0.5, sum by (le) (rate(tks_post_store_delay_seconds_bucket[1d]))) > 5400
          and sum(increase(tks_post_store_delay_seconds_count[1d])) > 100
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "The median new post is stored {{ $value | humanizeDuration }} after it was posted (A2: 1.5 h)"
          description: Checks run later than every 2 h 45 min, or the persister lags.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a2-new-posts-stored-within-3-h
      # A5: tks's cost per account a day (tks-scheduler prices the last 24 h
      # from tt.cost; the gauges are the leader's).
      - alert: TksCostNearBudget
        expr: |
          tks:leader:cost_per_account_usd > tks:leader:cost_budget_per_account_usd * tks:leader:cost_budget_alert_share
          and tks:leader:cost_budget_per_account_usd > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "tks costs {{ $value }} USD per account a day, past the alert share of the budget (A5)"
          description: Over the budget itself, backfills pause (TksCostOverBudget); checks go on. See the cost parts on the dashboard.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a5-cost-per-account-per-day
      - alert: TksCostOverBudget
        expr: tks:leader:cost_over_budget == 1
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: tks is over its budget per account a day; backfills and new accounts' admission are paused (A5)
          description: Checks go on. Raise tt.cost.budget_per_account_usd, or lower the cost (the parts in tks_cost_usd_day).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a5-cost-per-account-per-day
      - alert: TksCostNotPriced
        expr: absent(tks:leader:cost_per_account_usd)
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: tks's cost has not been priced for an hour (A5)
          description: The leader's cost loop fails (Postgres or Redis), or no scheduler leads; its logs say which.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-objectives.md#a5-cost-per-account-per-day
      - alert: TksMediaRefused
        expr: |
          sum(increase(tks_media_download_total{outcome="refused"}[1h]))
            / clamp_min(sum(increase(tks_media_download_total{outcome=~"ready|refused|failed|expired"}[1h])), 1e-9) > 0.1
          and sum(increase(tks_media_download_total{outcome="refused"}[1h])) > 10
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of TikTok media downloads are refused before their links expire"
          description: >-
            TikTok's media hosts refuse files tks has valid links for: most
            likely the video hosts no longer accept the reading identity's
            tt_chain_token (T18, T33). The files are read again at the post's
            next read.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-media.md#refused-downloads

  # tks-canary and the browser signer (docs/tiktok build brief M8; runbook
  # docs/runbooks/tks-canary.md). The canary checks each variant of the
  # crawler's operations on canary accounts every hour and promotes a
  # working one; the signer signs comments and replies in a few pages.
  - name: tks.canary
    rules:
      - alert: TksCanaryOperationFailing
        expr: min by (operation) (tks_canary_operation_healthy) == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.operation }}: TikTok no longer answers its active variant and the canary has none to promote"
          description: >-
            Refused on the canary accounts (TikTok moved or changed the call:
            add a candidate variant) or drifted (the parser misses required
            fields: fix it). GET /v1/admin/canary/runs has the checks.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#an-operation-is-failing
      - alert: TksCanaryNotRunning
        # Every tks binary exports the gauge (0 outside tks-canary); the
        # runs counter exists only where runs happen.
        expr: |
          time() - max(tks_canary_last_success_timestamp_seconds) > 3 * 3600
            and on () count(tks_canary_runs_total) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: No tks-canary run in 3 hours gave every operation a verdict
          description: >-
            TikTok's changes will not be followed. Usually no canary account
            loads (renamed, private, a blocked tier), the signer cannot sign,
            the accounts lack posts with comments or replies, or
            tt.canary.accounts is empty.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#the-canary-is-not-running
      - alert: TksCanaryPromoted
        expr: sum by (operation, why) (increase(tks_canary_promotions_total[1h])) > 0
        for: 0m
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.operation }}: the canary switched to another variant ({{ $labels.why }})"
          description: >-
            TikTok changed what it accepts. why=failed: the active variant
            stopped answering; if the new one is signed, every such call now
            costs browser time (the signer's share and pages rise). why=unsigned:
            a call no longer needs a signature.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#a-variant-was-promoted
      - alert: TksCanaryDrift
        expr: sum by (operation) (increase(tks_canary_checks_total{verdict="drift"}[2h])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.operation }}: TikTok's answer lacks fields the parser needs"
          description: >-
            A variant answered but its answer changed shape. If the active
            variant drifted and nothing replaced it, TksCanaryOperationFailing
            fires too. Add a fixture of the new answer and fix the parser.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#drift
      - alert: TksEmptyAnswers
        # The crawler's own calls (the canary's are named canary:*).
        expr: |
          sum by (query) (rate(tks_tt_requests_total{query!~"canary:.*", class="registry_stale"}[15m]))
            / clamp_min(sum by (query) (rate(tks_tt_requests_total{query!~"canary:.*"}[15m])), 1e-9) > 0.2
          and sum by (query) (rate(tks_tt_requests_total{query!~"canary:.*"}[15m])) > 0.05
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.query }}: {{ $value | humanizePercentage }} of TikTok's answers are empty"
          description: >-
            TikTok refuses the call with an empty answer: a changed variant
            the canary has not replaced yet, a signer whose pages went bad, or
            burnt identities.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#empty-answers
      - alert: TksSignerFailing
        expr: |
          sum(rate(tks_signer_signs_total{result="error"}[15m]))
            / clamp_min(sum(rate(tks_signer_signs_total[15m])), 1e-9) > 0.1
          and sum(rate(tks_signer_signs_total[15m])) > 0.01
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of signatures fail"
          description: >-
            Signer pages do not open or fail to sign: Chromium missing or
            crashing, TikTok's page not loading through the tier, or the
            page's script changed. Comments and replies wait in retries.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#the-signer-fails
      - alert: TksSignedCallsRefused
        expr: |
          sum(rate(tks_signed_calls_total{result="refused"}[15m]))
            / clamp_min(sum(rate(tks_signed_calls_total[15m])), 1e-9) > 0.1
          and sum(rate(tks_signed_calls_total[15m])) > 0.01
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "TikTok refuses {{ $value | humanizePercentage }} of the calls the signer signed"
          description: >-
            Signed comment and reply calls come back empty: pages going bad
            faster than they are replaced (C4), TikTok checking something new,
            or the signer giving itself away as automated (S1).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#signed-calls-refused
      - alert: TksSignerSaturated
        expr: |
          sum(rate(tks_signer_signs_total{result="busy"}[15m]))
            / clamp_min(sum(rate(tks_signer_signs_total[15m])), 1e-9) > 0.05
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of signatures waited past the sign timeout: every signer page busy"
          description: >-
            The pool's cap (tt.signer.pages, tks_signer_pages_max) is too low
            for the comment traffic: add crawler pods running the post and
            thread stages, or raise the cap where memory allows.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#the-signer-is-saturated
      - alert: TksSignerPagesChurn
        expr: sum(increase(tks_signer_page_closes_total{reason=~"memory|refused|error"}[1h])) > 60
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} signer pages closed in an hour for memory, refusals or errors"
          description: >-
            Pages are replaced far more often than their limits plan for:
            each new page is a TikTok page load through the tier and browser
            time. tks_signer_page_closes_total by reason says which.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-canary.md#signer-pages-churn
  # Posts no longer public (docs/tiktok/adr/0007 §17, M8b).
  - name: tks.posts
    rules:
      - alert: TksPostPagesUnknownCode
        expr: sum(increase(tks_post_vanish_total{result="unknown_code"}[6h])) > 20
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} post pages answered a statusCode not known to mean a post is gone (6 h)"
          description: >-
            Posts a list stopped returning were checked on their pages, which
            answered a code not in tt.posts.unavailable.codes, so they stay
            visible in the store. The crawler logs each code. Confirm what the
            code means (T34) before adding it.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-posts.md#unknown-codes
      - alert: TksPostsVanishingAtOnce
        expr: sum(increase(tks_post_vanish_total{result="reading_problem"}[6h])) > 50
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} stored posts missing from crowded list pages (6 h)"
          description: >-
            Full list pages left out more stored posts than
            tt.posts.unavailable.max_per_page, which tks treats as a reading
            problem and marks nothing. Many at once suggests the creator list
            changed what it serves.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-tiktok/blob/main/docs/runbooks/tks-posts.md#many-posts-missing-at-once
