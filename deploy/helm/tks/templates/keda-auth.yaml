{{- if and .Values.keda.enabled .Values.keda.authSecret }}
# Credentials the KEDA lag triggers use to reach brokers that need SASL/TLS.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "tks.fullname" . }}-kafka
  labels: {{- include "tks.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    {{- if .Values.keda.authKeys }}
    {{- range $param, $key := .Values.keda.authKeys }}
    - parameter: {{ $param }}
      name: {{ $.Values.keda.authSecret }}
      key: {{ $key }}
    {{- end }}
    {{- else }}
    {{- range .Values.keda.authParams }}
    - parameter: {{ . }}
      name: {{ $.Values.keda.authSecret }}
      key: {{ . }}
    {{- end }}
    {{- end }}
{{- end }}
