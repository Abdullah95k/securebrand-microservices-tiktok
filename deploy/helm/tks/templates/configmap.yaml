apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tks.fullname" . }}-config
  labels: {{- include "tks.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml .Values.config | indent 4 }}
---
# Same config for the pre-install/pre-upgrade hook Jobs, which run before
# regular release resources exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tks.fullname" . }}-hook-config
  labels: {{- include "tks.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
{{ toYaml .Values.config | indent 4 }}
