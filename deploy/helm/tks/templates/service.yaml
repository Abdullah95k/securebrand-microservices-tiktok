{{- if .Values.components.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tks.fullname" . }}-api
  labels: {{- include "tks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "tks.selector" (dict "root" . "name" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tks.fullname" . }}-api
  labels: {{- include "tks.labels" . | nindent 4 }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "tks.fullname" . }}-api
                port: {name: http}
          # The discovery review page (static files; it calls /v1).
          - path: /review
            pathType: Prefix
            backend:
              service:
                name: {{ include "tks.fullname" . }}-api
                port: {name: http}
{{- end }}
{{- end }}
{{- $root := . -}}
{{- range $name, $c := .Values.components }}
{{- if and $c.enabled $c.service $c.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tks.fullname" $root }}-{{ $name }}
  labels: {{- include "tks.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "tks.selector" (dict "root" $root "name" $name) | nindent 4 }}
  ports:
    - {name: http, port: {{ $c.port }}, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
{{- end }}
{{- end }}
