{{- if .Values.components.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fbs.fullname" . }}-api
  labels: {{- include "fbs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "fbs.selector" (dict "root" . "name" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fbs.fullname" . }}-api
  labels: {{- include "fbs.labels" . | nindent 4 }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.api.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "fbs.fullname" . }}-api
                port: {name: http}
{{- end }}
{{- end }}
