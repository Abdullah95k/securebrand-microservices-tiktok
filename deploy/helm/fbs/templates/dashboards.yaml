{{- if .Values.dashboards.enabled }}
{{- $root := . -}}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fbs.fullname" $root }}-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    {{- include "fbs.labels" $root | nindent 4 }}
    {{- toYaml $root.Values.dashboards.labels | nindent 4 }}
  {{- with $root.Values.dashboards.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ base $path }}: |-
    {{- $root.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
