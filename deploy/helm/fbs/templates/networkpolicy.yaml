{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fbs.fullname" . }}-ingress
  labels: {{- include "fbs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fbs
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsFromNamespace }}
      ports: [{port: 9090}]
    - ports: [{port: 8080}]
      from:
        - podSelector: {}
        - namespaceSelector: {}
{{- end }}
