name: guard

# Fails when a recording, probe output or credentials file is committed, or
# when a relative link in the docs points at a missing file. igs's CI
# (ci.yml, soak.yml) runs beside it since the seed (M1a).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No secrets in the code or its history (gitleaks, G4)
        # .gitleaks.toml: gitleaks' rules plus known synthetic values;
        # .gitleaksignore: old findings that hold no secret.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner
      - name: No recordings, probe output or credentials in git
        run: |
          bad=$(git ls-files | grep -Ei '(\.har(\.gz|\.zip)?$|^\.local/|^phase0/(out|proxies\.yaml|tt-accounts(-all)?\.txt))' || true)
          if [ -n "$bad" ]; then echo "::error::committed files that must stay local:"; echo "$bad"; exit 1; fi
      - name: Relative links in docs resolve
        run: scripts/check-doc-links.sh
