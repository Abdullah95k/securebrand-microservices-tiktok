name: guard

# Fails when a recording, probe output or credentials file is committed, or
# when a relative link in the docs points at a missing file. igs's CI
# (ci.yml, soak.yml) runs beside it since the seed (M1a).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No recordings, probe output or credentials in git
        run: |
          bad=$(git ls-files | grep -Ei '(\.har(\.gz|\.zip)?$|^\.local/|^phase0/(out|proxies\.yaml|tt-accounts(-all)?\.txt))' || true)
          if [ -n "$bad" ]; then echo "::error::committed files that must stay local:"; echo "$bad"; exit 1; fi
      - name: Relative links in docs resolve
        run: scripts/check-doc-links.sh
