name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          buf lint
          buf generate
          git diff --exit-code -- gen/
      - name: Proto breaking changes
        if: github.event_name == 'pull_request'
        run: |
          # git ls-tree exits 0 for missing paths; cat-file -e does not.
          if git cat-file -e "origin/${{ github.base_ref }}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
          else
            echo "no buf module on the base branch yet"
          fi
      - name: Fixtures contain no real signed URLs
        run: |
          if grep -rlE 'oh=00_|_nc_cat=' testdata/; then
            echo "fixtures with real fbcdn signatures: run fbctl fixtures scrub"; exit 1
          fi
          if grep -rlE 'x-signature=|[?&]signature=|[?&]policy=|tt_chain_token' testdata/tt; then
            echo "TikTok fixtures with signed links: add them with tksctl fixtures add"; exit 1
          fi
      - name: Unit tests (parsers, fake Facebook client layer, accounting)
        env: {TKS_BROWSER_NO_SANDBOX: "1"} # runners may not allow the Chromium sandbox
        run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: fbs, POSTGRES_PASSWORD: fbs, POSTGRES_DB: fbs}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fbs" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Redpanda
        # Partitions cost memory (topic_memory_per_partition): packages run
        # side by side, each creating its own topics, so 1G ran out.
        run: |
          docker run -d --name redpanda -p 19092:19092 -p 18081:8081 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --memory 2G \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health --exit-when-healthy && break; sleep 2; done
      - name: Integration and end-to-end tests
        env:
          TKS_TEST_PG_DSN: postgres://fbs:fbs@localhost:5432/fbs?sslmode=disable
          TKS_TEST_REDIS_ADDR: localhost:6379
          TKS_TEST_KAFKA_BROKERS: localhost:19092
          TKS_TEST_SCHEMA_REGISTRY: http://localhost:18081
          TKS_BROWSER_NO_SANDBOX: "1"
        # Every package: a test needing Postgres, Redis or Kafka skips without
        # them, so listing packages here let new integration tests go unrun.
        run: go test -count=1 -timeout 25m ./...

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          make chart-check
          helm template fbs deploy/helm/fbs --set keda.enabled=false,api.ingress.enabled=true,networkPolicy.enabled=true > /dev/null
          helm template fbs deploy/helm/fbs --set alerts.enabled=true,dashboards.enabled=true,serviceMonitor.enabled=true > /tmp/monitoring.yaml
          grep -q "kind: PrometheusRule" /tmp/monitoring.yaml && grep -q "fbs-overview.json" /tmp/monitoring.yaml
      - name: Docker build
        run: |
          docker build -f deploy/docker/Dockerfile -t fbs:ci .
          docker build -f deploy/docker/Dockerfile --target browser -t fbs:ci-browser .
          docker run --rm --entrypoint chromium fbs:ci-browser --version
      - name: Chart smoke run (the chart's workloads in Docker against fakefb)
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          make infra-up
          make chart-smoke IMAGE=fbs:ci
      - name: Compose config is valid (local stack and pilot)
        run: |
          docker compose -f deploy/compose/docker-compose.yml config -q
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/pilot.yml config -q
